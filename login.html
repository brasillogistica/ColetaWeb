<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login | ColetaWeb</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @media (max-width: 768px) {
            body {
                padding: 12px !important;
                height: 100vh !important;
                align-items: center !important;
            }

            .card {
                width: 100% !important;
                max-width: 100% !important;
                padding: 18px !important;
                border-radius: 18px !important;
            }

            .card > div:first-child {
                font-size: 22px !important;
                margin-bottom: 24px !important;
            }

            h2 {
                font-size: 1.1rem !important;
                margin-bottom: 16px !important;
            }

            .form-group input {
                font-size: 16px !important;
                min-height: 42px;
            }

            .btn-main {
                width: 100% !important;
                min-height: 48px;
                font-size: 13px !important;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 8px !important;
            }

            .card {
                padding: 14px !important;
                border-radius: 16px !important;
            }

            h2 {
                font-size: 1rem !important;
            }
        }
    </style>
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh;">

    <div class="card" style="width: 400px; text-align: center;">
        <div style="font-size: 24px; font-weight: 800; margin-bottom: 30px;">
            <span style="color: var(--navy);">minerva</span><span style="color: var(--red);">foods</span>
        </div>
        
        <h2 style="color: var(--navy); margin-bottom: 20px; font-size: 1.2rem;">LOGIN - COLETAWEB</h2>
        
        <div class="form-group" style="text-align: left;">
            <label>E-MAIL</label>
            <input type="email" id="email" placeholder="seu.email@minervafoods.com">
        </div>
        
        <div class="form-group" style="text-align: left;">
            <label>SENHA</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        
        <button class="btn-main" style="width: 100%; margin-top: 20px; background: var(--red);" onclick="fazerLogin()">ENTRAR</button>
    </div>

    <script src="script.js"></script>
    <script>
        async function fazerLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert("Por favor, preencha e-mail e senha.");
                return;
            }

            try {
                if (typeof clienteSupabase === 'undefined') {
                    alert("Erro: O cliente Supabase não foi carregado.");
                    return;
                }

                const { data, error } = await clienteSupabase.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) {
                    alert("Erro no Login: " + error.message);
                } else {
                    window.location.href = 'index.html';
                }
            } catch (err) {
                console.error("Erro crítico:", err);
            }
        }

        document.getElementById("password").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                fazerLogin();
            }
        });
    </script>
</body>
</html>
