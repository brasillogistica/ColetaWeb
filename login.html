<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login | ColetaWeb</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        .login-title {
            font-weight: 400 !important;
            text-transform: none;
        }

        .login-logo {
            font-weight: 800;
            font-size: 24px;
            line-height: 1.1;
            text-align: center;
        }

        .login-logo .minerva {
            color: var(--navy);
        }

        .login-logo .foods {
            color: var(--red);
        }

        .login-footer {
            margin-top: 8px;
            font-size: 11px;
            color: var(--navy);
            opacity: 0.65;
            text-align: center;
            user-select: none;
        }
    </style>
</head>
<body class="login-page">
    <div class="login-container">
        <div class="card login-card">
            <div class="login-logo">
                <span class="minerva">minerva</span><span class="foods">foods</span>
            </div>

            <h2 class="login-title">Login - ColetaWeb</h2>

            <div class="login-form">
                <div class="form-group">
                    <label for="email">E-MAIL</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="seu.email@minervafoods.com"
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="password">SENHA</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="••••••••"
                        autocomplete="current-password"
                    >
                </div>

                <button class="btn-main login-button" onclick="fazerLogin()">ENTRAR</button>
            </div>

            <div class="login-footer">Desenvolvido por Leandro Brasil • 2026</div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        async function fazerLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert('Por favor, preencha e-mail e senha.');
                return;
            }

            try {
                if (typeof clienteSupabase === 'undefined' || !clienteSupabase) {
                    alert('Erro: O cliente Supabase não foi carregado.');
                    return;
                }

                const { error } = await clienteSupabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    alert('Erro no Login: ' + error.message);
                    return;
                }

                window.location.href = 'index.html';
            } catch (err) {
                console.error('Erro crítico:', err);
                alert('Erro inesperado ao entrar.');
            }
        }

        document.getElementById('password').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                fazerLogin();
            }
        });
    </script>
</body>
</html>
