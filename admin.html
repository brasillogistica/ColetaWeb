<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
    <title>Gerenciamento | ColetaWeb</title>
</head>
<body style="padding: 40px; background: #f2f2f2;">

    <div class="card">
        <h2 style="color: var(--navy); margin-bottom: 20px;">GERENCIAMENTO DE USUÁRIOS</h2>
        
        <!-- Formulário para Novo Usuário -->
        <div style="margin-bottom: 30px; padding: 15px; border: 1px solid var(--gold); border-radius: 10px; background: #fafafa;">
            <h3 style="color: var(--navy); margin-bottom: 15px; font-size: 14px;">Adicionar novo usuário (Cadastre antes em Authentication)</h3>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <input type="email" id="novoEmail" placeholder="email@minervafoods.com" style="padding: 8px; width: 220px; border: 1px solid #ccc; border-radius: 5px;">
                
                <select id="novoPerfil" style="padding: 8px;">
                    <option value="user">User</option>
                    <option value="administrador">Administrador</option>
                </select>

                <select id="novaTransportadora" style="padding: 8px;">
                    <option value="">Carregando...</option>
                </select>

                <button class="btn-main" style="padding: 8px 15px; background: var(--navy); font-size: 12px;" onclick="criarUsuario()">CRIAR</button>
            </div>
        </div>

        <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
            <thead>
                <tr style="background: var(--navy); color: white;">
                    <th style="padding: 10px; text-align: left;">E-mail</th>
                    <th style="padding: 10px; text-align: left;">Transportadora</th>
                    <th style="padding: 10px; text-align: left;">Perfil</th>
                </tr>
            </thead>
            <tbody id="user-table-body">
                <!-- Usuários carregados via JS -->
            </tbody>
        </table>
        <button class="btn-main" style="background: var(--grey);" onclick="window.location.href='index.html'">VOLTAR</button>
    </div>

    <script src="script.js"></script>
    <script>
        async function carregarUsuarios() {
            if (typeof clienteSupabase === 'undefined') { setTimeout(carregarUsuarios, 500); return; }

            const { data: { session } } = await clienteSupabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }

            const { data: userData } = await clienteSupabase
                .from('usuarios')
                .select('perfil')
                .eq('email', session.user.email)
                .single();

            if (!userData || (userData.perfil !== 'master' && userData.perfil !== 'administrador')) {
                alert("Acesso Negado: Área restrita.");
                window.location.href = 'index.html';
                return;
            }

            const { data, error } = await clienteSupabase.from('usuarios').select('*');
            if (error) { console.error(error); return; }

            const tbody = document.getElementById('user-table-body');
            tbody.innerHTML = '';
            
            data.forEach(user => {
                let perfilTd = user.perfil;
                
                // Regra: Master não pode ter o perfil alterado aqui
                if (userData.perfil === 'master' && user.perfil !== 'master') {
                    perfilTd = `
                        <select onchange="atualizarCampo('${user.email}', 'perfil', this.value)" style="padding: 5px;">
                            <option value="user" ${user.perfil === 'user' ? 'selected' : ''}>User</option>
                            <option value="administrador" ${user.perfil === 'administrador' ? 'selected' : ''}>Administrador</option>
                        </select>`;
                }
                
                tbody.innerHTML += `
                    <tr>
                        <td style="padding: 10px; border-bottom: 1px solid #ddd;">${user.email}</td>
                        <td style="padding: 10px; border-bottom: 1px solid #ddd;">${user.transportadora || 'N/A'}</td>
                        <td style="padding: 10px; border-bottom: 1px solid #ddd;">${perfilTd}</td>
                    </tr>
                `;
            });
        }

        async function criarUsuario() {
            const email = document.getElementById('novoEmail').value;
            const perfil = document.getElementById('novoPerfil').value;
            const transportadora = document.getElementById('novaTransportadora').value;

            if(!email) return alert("Digite um e-mail");
            if(!transportadora) return alert("Selecione uma transportadora");
            
            // Inserção direta no banco sem enviar e-mail
            const { error } = await clienteSupabase.from('usuarios').insert([{ 
                email: email, 
                perfil: perfil, 
                transportadora: transportadora,
                status: 'aprovado' 
            }]);
            
            if (error) alert("Erro ao criar: " + error.message);
            else { alert("Usuário vinculado com sucesso no banco!"); document.getElementById('novoEmail').value = ''; carregarUsuarios(); }
        }

        async function atualizarCampo(email, campo, valor) {
            const updateObj = {};
            updateObj[campo] = valor;
            
            const { error } = await clienteSupabase
                .from('usuarios')
                .update(updateObj)
                .eq('email', email);
            
            if (error) alert("Erro ao atualizar: " + error.message);
            else { alert("Atualizado com sucesso!"); carregarUsuarios(); }
        }

        window.onload = async () => {
            await carregarUsuarios();
            await carregarTransportadoras();
        };
    </script>
</body>
</html>
