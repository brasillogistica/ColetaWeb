<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Histórico | ColetaWeb</title>
    <!-- Supabase e Biblioteca para Excel -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body style="padding: 40px; background: #f2f2f2;">

    <div class="card">
        <h2 style="color: var(--navy); margin-bottom: 20px;">HISTÓRICO DE COLETA</h2>
        
        <div style="margin-bottom: 15px;">
            <button class="btn-main" style="background: var(--navy); padding: 10px 20px; font-size: 12px;" onclick="exportarExcel()">EXPORTAR PARA EXCEL</button>
        </div>

        <div style="overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse; font-size: 14px;">
                <thead>
                    <tr style="background: var(--navy); color: white;">
                        <th style="padding: 10px; text-align: center;">Data</th>
                        <th style="padding: 10px; text-align: center;">Hora</th>
                        <th style="padding: 10px; text-align: center;">Container</th>
                        <th id="th-transportadora" style="padding: 10px; text-align: center; display: none;">Transportadora</th>
                        <th style="padding: 10px; text-align: center;">GPS</th>
                        <th style="padding: 10px; text-align: center;">Foto</th>
                    </tr>
                </thead>
                <tbody id="historico-body">
                    <!-- Dados carregados via JS -->
                </tbody>
            </table>
        </div>
        
        <button class="btn-main" style="background: var(--grey); margin-top: 20px;" onclick="window.location.href='index.html'">VOLTAR</button>
    </div>

    <!-- Modal para exibir a foto com suporte a zoom e arrasto -->
    <div id="foto-modal" style="display:none; position:fixed; z-index:2000; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.9); overflow: hidden; cursor: grab;">
        <span onclick="fecharFoto()" style="position:absolute; top:20px; right:30px; color:white; font-size:40px; cursor:pointer; font-weight:bold; z-index: 2001;">&times;</span>
        
        <div id="container-img" style="width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; transition: transform 0.1s;">
            <img id="foto-ampliada" style="max-width:90%; max-height:90%; user-select: none;">
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        let dadosExportacao = [];
        let scale = 1;
        let isDragging = false;
        let startX, startY, transX = 0, transY = 0;
        
        const containerImg = document.getElementById('container-img');
        const img = document.getElementById('foto-ampliada');

        async function carregarHistorico(tentativas = 0) {
            if (typeof clienteSupabase === 'undefined' || clienteSupabase === null) {
                if (tentativas < 10) {
                    setTimeout(() => carregarHistorico(tentativas + 1), 500);
                    return;
                }
                return;
            }

            const { data: { user } } = await clienteSupabase.auth.getUser();
            if (!user) { window.location.href = 'login.html'; return; }

            const { data: userData } = await clienteSupabase
                .from('usuarios')
                .select('perfil, transportadora')
                .eq('email', user.email)
                .single();

            const perfil = userData ? userData.perfil.trim().toLowerCase() : "";
            const ehAdmin = (perfil === 'master' || perfil === 'mestre' || perfil === 'administrador');

            if (ehAdmin) document.getElementById('th-transportadora').style.display = 'table-cell';

            let query = clienteSupabase.from('coletas').select('*');
            if (!ehAdmin && userData.transportadora) {
                query = query.eq('transportadora', userData.transportadora);
            }
            
            const { data, error } = await query.order('created_at', { ascending: false });
            
            if (error) { alert("Erro ao carregar histórico: " + error.message); return; }

            dadosExportacao = data;
            const tbody = document.getElementById('historico-body');
            tbody.innerHTML = '';
            
            data.forEach(item => {
                const dataHora = new Date(item.created_at);
                const fotoUrl = item.foto_url 
                    ? `https://ekmcgifpvqrdgcikvepe.supabase.co/storage/v1/object/public/coletas-fotos/${item.foto_url}`
                    : null;
                
                tbody.innerHTML += `
                    <tr style="border-bottom: 1px solid #ddd;">
                        <td style="padding: 10px; text-align: center;">${dataHora.toLocaleDateString()}</td>
                        <td style="padding: 10px; text-align: center;">${dataHora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</td>
                        <td style="padding: 10px; text-align: center;">${item.container || "N/A"}</td>
                        ${ehAdmin ? `<td style="padding: 10px; text-align: center;">${item.transportadora || "N/A"}</td>` : ""}
                        <td style="padding: 10px; text-align: center;">${item.localizacao || "N/A"}</td>
                        <td style="padding: 10px; text-align: center;">
                            ${fotoUrl ? `<span style="cursor:pointer; color:var(--navy); text-decoration:underline;" onclick="abrirFoto('${fotoUrl}')">Ver Foto</span>` : "Sem foto"}
                        </td>
                    </tr>
                `;
            });
        }
        
        function abrirFoto(url) {
            img.src = url;
            scale = 1; transX = 0; transY = 0;
            updateTransform();
            document.getElementById('foto-modal').style.display = 'flex';
        }

        function fecharFoto() {
            document.getElementById('foto-modal').style.display = 'none';
        }

        function updateTransform() {
            containerImg.style.transform = `translate(${transX}px, ${transY}px) scale(${scale})`;
        }

        // Zoom com roda do mouse
        document.getElementById('foto-modal').addEventListener('wheel', (e) => {
            e.preventDefault();
            scale += e.deltaY * -0.001;
            scale = Math.min(Math.max(0.5, scale), 5);
            updateTransform();
        });

        // Arrastar com mouse
        containerImg.addEventListener('mousedown', (e) => { 
            isDragging = true; 
            startX = e.clientX - transX; 
            startY = e.clientY - transY; 
        });
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            transX = e.clientX - startX;
            transY = e.clientY - startY;
            updateTransform();
        });

        function exportarExcel() {
            if(dadosExportacao.length === 0) return alert("Sem dados para exportar");
            const ws = XLSX.utils.json_to_sheet(dadosExportacao);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Coletas");
            XLSX.writeFile(wb, "Historico_Coletas.xlsx");
        }

        window.onload = () => carregarHistorico();
    </script>
</body>
</html>
