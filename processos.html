<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Processos Container | ColetaWeb</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        .filters-grid .form-group label {
            text-align: center;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        /* Bloco unificado de data */
        .date-range {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .date-range input {
            flex: 1;
            min-width: 0;
        }

        /* Status centralizado com fundo mais destacado */
        .status-text {
            display: inline-block;
            padding: 6px 10px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            border: 1px solid #d0d0d0;
            border-radius: 6px;
            background-color: #eaeaea;
            color: #333;
            min-width: 140px;
            text-align: center;
        }

        /* Joinha */
        .thumbs-up {
            display: inline-block;
            margin-left: 5px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .thumbs-up.show {
            opacity: 1;
        }

        /* Botões compactos padrão Minerva */
        .btn-action {
            padding: 8px 16px;
            border-radius: 99px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            border: 1px solid var(--gold);
            background: transparent;
            color: var(--navy);
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn-navy {
            background: var(--navy);
            color: white;
            border: none;
        }
        .btn-grey {
            background: var(--grey);
            color: white;
            border: none;
        }
        .btn-excel {
            background: #107c41;
            color: white;
            border: none;
        }
        .btn-excel:hover {
            background: #0d6b35;
        }

        /* Botões de navegação de status (menores) */
        .btn-status { 
            background: var(--navy); color: white; border: none; 
            padding: 5px 10px; border-radius: 5px; cursor: pointer; 
            font-size: 12px; margin: 0 2px; font-weight: 700;
        }
        .btn-status:disabled { background: #ccc; cursor: not-allowed; }

        .btn-confirm {
            border: none;
            padding: 5px 10px;
            margin: 0 2px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-sim { background: #28a745; color: white; }
        .btn-nao { background: #dc3545; color: white; }
        .btn-confirm:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Tabela */
        table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }
        th {
            background: var(--navy);
            color: white;
            padding: 10px 8px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }
        td {
            padding: 10px 8px;
            border-bottom: 1px solid #eee;
            font-size: 12px;
            color: #333;
            text-align: center;
        }

        /* Link de localização */
        .loc-link {
            color: var(--navy);
            cursor: pointer;
            text-decoration: underline;
            font-weight: 600;
        }
        .loc-link:hover {
            color: var(--red);
        }

        /* Modal do Mapa */
        #mapa-modal {
            display: none;
            position: fixed;
            z-index: 3000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
        }
        .mapa-container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            width: 90%;
            max-width: 800px;
            height: 80vh;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .mapa-container iframe {
            width: 100%;
            height: calc(100% - 40px);
            border: none;
            border-radius: 10px;
        }
        .fechar-mapa {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 30px;
            color: var(--navy);
            cursor: pointer;
            font-weight: bold;
            z-index: 10;
        }
    </style>
</head>
<body style="padding: 40px; background: #f2f2f2;">

    <div class="card">
        <h2 style="color: var(--navy); margin-bottom: 25px; font-weight: 800;">PROCESSOS - CONTAINER</h2>
        
        <!-- Filtros -->
        <div class="filters-grid">
            <div class="form-group">
                <label>Data Registro</label>
                <div class="date-range">
                    <input type="date" id="filtroDataInicio" placeholder="Início">
                    <span style="font-size: 12px; color: var(--navy); font-weight: 700;">até</span>
                    <input type="date" id="filtroDataFim" placeholder="Fim">
                </div>
            </div>
            <div class="form-group">
                <label>Data Retirada</label>
                <input type="date" id="filtroDataRetirada">
            </div>
            <div class="form-group">
                <label>Armador</label>
                <input type="text" id="filtroArmador" placeholder="Nome do armador">
            </div>
            <div class="form-group">
                <label>Container</label>
                <input type="text" id="filtroContainer" placeholder="Número">
            </div>
            <div class="form-group">
                <label>Placa</label>
                <input type="text" id="filtroPlaca" placeholder="Placa">
            </div>
            <div class="form-group">
                <label>Carga / Pulmão</label>
                <select id="filtroCargaPulmao">
                    <option value="">Todos</option>
                    <option value="Carga">Carga</option>
                    <option value="Pulmão">Pulmão</option>
                </select>
            </div>
            <div class="form-group">
                <label>Terminal</label>
                <input type="text" id="filtroTerminal" placeholder="Terminal">
            </div>
            <div class="form-group">
                <label>Cidade</label>
                <input type="text" id="filtroCidade" placeholder="Cidade">
            </div>
            <div class="form-group">
                <label>Transportadora</label>
                <input type="text" id="filtroTransportadora" placeholder="Transportadora">
            </div>
            <div class="form-group">
                <label>Status</label>
                <select id="filtroStatus">
                    <option value="">Todos</option>
                    <option value="ag. locação">AG. LOCAÇÃO</option>
                    <option value="ag. carregamento">AG. CARREGAMENTO</option>
                    <option value="pendencia logistica">PENDÊNCIA LOGÍSTICA</option>
                    <option value="faturado">FATURADO</option>
                    <option value="ag. liberação">AG. LIBERAÇÃO</option>
                    <option value="em viagem">EM VIAGEM</option>
                    <option value="depositado">DEPOSITADO</option>
                </select>
            </div>
        </div>

        <!-- Botões de ação compactos estilo Minerva -->
        <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 20px;">
            <button class="btn-action btn-navy" onclick="aplicarFiltros()">Filtrar</button>
            <button class="btn-action" onclick="limparFiltros()">Limpar Filtros</button>
            <button class="btn-action btn-excel" onclick="exportarExcel()">Exportar Excel</button>
            <button class="btn-action btn-grey" onclick="window.location.href='index.html'">Voltar</button>
        </div>

        <div style="overflow-x: auto; margin-top: 20px;">
            <table>
                <thead>
                    <tr>
                        <th>Data/Hora</th>
                        <th>Retirada</th>
                        <th>Armador</th>
                        <th>Container</th>
                        <th>Placa</th>
                        <th>Tara</th>
                        <th>Max Gross</th>
                        <th>C/P</th>
                        <th>Terminal</th>
                        <th>Cidade</th>
                        <th id="th-transportadora" style="display: none;">Transportadora</th>
                        <th>Status</th>
                        <th>Ações</th>
                        <th>Confirmar</th>
                        <th>Localização</th>
                        <th>Foto</th>
                    </tr>
                </thead>
                <tbody id="processos-body"></tbody>
            </table>
        </div>
    </div>

    <!-- Modal Foto -->
    <div id="foto-modal" style="display:none; position:fixed; z-index:2000; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.9); overflow: hidden; cursor: grab;">
        <span onclick="fecharFoto()" style="position:absolute; top:20px; right:30px; color:white; font-size:40px; cursor:pointer; font-weight:bold; z-index:2001;">&times;</span>
        <div id="container-img" style="width:100%; height:100%; display:flex; justify-content:center; align-items:center; transition:transform 0.1s;">
            <img id="foto-ampliada" style="max-width:90%; max-height:90%; user-select:none;">
        </div>
    </div>

    <!-- Modal Mapa -->
    <div id="mapa-modal">
        <div class="mapa-container">
            <span class="fechar-mapa" onclick="fecharMapa()">&times;</span>
            <iframe id="mapa-iframe" src="" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        let dadosExportacao = [];
        let scale = 1, isDragging = false, startX, startY, transX = 0, transY = 0;
        const containerImg = document.getElementById('container-img');
        const img = document.getElementById('foto-ampliada');

        const statusFluxo = [
            'ag. locação',
            'ag. carregamento',
            'pendencia logistica',
            'faturado',
            'ag. liberação',
            'em viagem',
            'depositado'
        ];

        const statusOriginais = {};

        async function carregarProcessos(filtros = {}) {
            if (typeof clienteSupabase === 'undefined') {
                setTimeout(() => carregarProcessos(filtros), 500);
                return;
            }

            const { data: { user } } = await clienteSupabase.auth.getUser();
            if (!user) { window.location.href = 'login.html'; return; }

            const { data: userData } = await clienteSupabase
                .from('usuarios')
                .select('perfil, transportadora')
                .eq('email', user.email)
                .single();

            const perfil = userData ? userData.perfil.trim().toLowerCase() : "";
            const ehAdmin = (perfil === 'master' || perfil === 'mestre' || perfil === 'administrador');

            if (ehAdmin) document.getElementById('th-transportadora').style.display = 'table-cell';

            let query = clienteSupabase.from('coletas').select('*');
            
            if (!ehAdmin && userData.transportadora) {
                query = query.eq('transportadora', userData.transportadora);
            }

            // Filtros de data
            if (filtros.dataInicio || filtros.dataFim) {
                const inicio = filtros.dataInicio ? new Date(filtros.dataInicio) : null;
                const fim = filtros.dataFim ? new Date(filtros.dataFim) : null;

                if (inicio && fim) {
                    if (inicio.getTime() === fim.getTime()) {
                        const startOfDay = new Date(inicio);
                        startOfDay.setHours(0,0,0,0);
                        const endOfDay = new Date(inicio);
                        endOfDay.setHours(23,59,59,999);
                        query = query.gte('created_at', startOfDay.toISOString()).lte('created_at', endOfDay.toISOString());
                    } else {
                        query = query.gte('created_at', inicio.toISOString()).lte('created_at', fim.toISOString());
                    }
                } else if (inicio) {
                    query = query.gte('created_at', inicio.toISOString());
                } else if (fim) {
                    query = query.lte('created_at', fim.toISOString());
                }
            }
            if (filtros.dataRetirada) query = query.eq('data_retirada', filtros.dataRetirada);
            if (filtros.armador) query = query.ilike('armador', `%${filtros.armador}%`);
            if (filtros.container) query = query.ilike('container', `%${filtros.container}%`);
            if (filtros.placa) query = query.ilike('placa', `%${filtros.placa}%`);
            if (filtros.cargaPulmao) query = query.eq('carga_pulmao', filtros.cargaPulmao);
            if (filtros.terminal) query = query.ilike('terminal_coleta', `%${filtros.terminal}%`);
            if (filtros.cidade) query = query.ilike('cidade', `%${filtros.cidade}%`);
            if (filtros.transportadora) query = query.ilike('transportadora', `%${filtros.transportadora}%`);
            if (filtros.status) query = query.eq('status', filtros.status);

            const { data, error } = await query.order('created_at', { ascending: false });
            
            if (error) { alert("Erro ao carregar: " + error.message); return; }

            dadosExportacao = data;
            const tbody = document.getElementById('processos-body');
            tbody.innerHTML = '';
            for (let key in statusOriginais) delete statusOriginais[key];
            
            data.forEach(item => {
                const dataHora = new Date(item.created_at);
                const fotoUrl = item.foto_url 
                    ? `https://ekmcgifpvqrdgcikvepe.supabase.co/storage/v1/object/public/coletas-fotos/${item.foto_url}`
                    : null;
                
                const statusAtual = item.status || 'ag. locação';
                const statusId = `status-${item.id}`;
                const thumbsId = `thumbs-${item.id}`;
                statusOriginais[statusId] = statusAtual;

                const isFinalizado = item.finalizado || statusAtual === 'depositado';

                // Preparar a localização para o modal do Google Maps
                let localizacaoHtml = '';
                const loc = item.localizacao || "N/A";
                if (loc !== "N/A" && loc !== "GPS Bloqueado" && loc !== "Sem GPS") {
                    const queryMaps = encodeURIComponent(loc);
                    localizacaoHtml = `<span class="loc-link" onclick="abrirMapa('${queryMaps}')" title="Ver no mapa">📍 Local</span>`;
                } else {
                    localizacaoHtml = loc;
                }

                tbody.innerHTML += `
                    <tr>
                        <td>${dataHora.toLocaleDateString()} ${dataHora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</td>
                        <td>${item.data_retirada || "N/A"}</td>
                        <td>${item.armador || "N/A"}</td>
                        <td>${item.container || "N/A"}</td>
                        <td>${item.placa || "N/A"}</td>
                        <td>${item.tara || "N/A"}</td>
                        <td>${item.max_gross || "N/A"}</td>
                        <td>${item.carga_pulmao || "N/A"}</td>
                        <td>${item.terminal_coleta || "N/A"}</td>
                        <td>${item.cidade || "N/A"}</td>
                        ${ehAdmin ? `<td>${item.transportadora || "N/A"}</td>` : ""}
                        <td style="text-align: center;">
                            <span id="${statusId}" class="status-text" data-original="${statusAtual}">${statusAtual.toUpperCase()}</span>
                            <span id="${thumbsId}" class="thumbs-up">👍</span>
                        </td>
                        <td style="text-align: center;">
                            <button class="btn-status" ${isFinalizado ? 'disabled' : ''} onclick="navegarStatus('${statusId}', -1)">◀</button>
                            <button class="btn-status" ${isFinalizado ? 'disabled' : ''} onclick="navegarStatus('${statusId}', 1)">▶</button>
                        </td>
                        <td style="text-align: center;">
                            <button class="btn-confirm btn-sim" ${isFinalizado ? 'disabled' : ''} onclick="confirmarStatus('${item.id}', '${statusId}', '${thumbsId}')">Sim</button>
                            <button class="btn-confirm btn-nao" ${isFinalizado ? 'disabled' : ''} onclick="resetarStatus('${statusId}')">Não</button>
                        </td>
                        <td>${localizacaoHtml}</td>
                        <td style="text-align: center;">
                            ${fotoUrl ? `<span style="cursor:pointer; color:var(--navy); text-decoration:underline;" onclick="abrirFoto('${fotoUrl}')">Ver Foto</span>` : "Sem foto"}
                        </td>
                    </tr>
                `;
            });
        }

        function navegarStatus(statusId, direcao) {
            const span = document.getElementById(statusId);
            if (!span) return;
            const currentStatus = span.getAttribute('data-current') || span.getAttribute('data-original');
            const idx = statusFluxo.indexOf(currentStatus);
            if (idx === -1) return;
            let novoIdx = idx + direcao;
            if (novoIdx < 0 || novoIdx >= statusFluxo.length) return;
            const newStatus = statusFluxo[novoIdx];
            span.textContent = newStatus.toUpperCase();
            span.setAttribute('data-current', newStatus);
        }

        async function confirmarStatus(id, statusId, thumbsId) {
            const span = document.getElementById(statusId);
            if (!span) return;
            let novoStatus = span.getAttribute('data-current') || span.getAttribute('data-original');
            if (!novoStatus) return;

            const finalizado = (novoStatus === 'depositado');

            const { error } = await clienteSupabase
                .from('coletas')
                .update({ status: novoStatus, finalizado: finalizado })
                .eq('id', id);

            if (error) {
                console.error("Erro ao atualizar status:", error);
                alert("Erro ao salvar: " + error.message + "\nVerifique as permissões no banco de dados (RLS).");
                return;
            }

            span.setAttribute('data-original', novoStatus);
            span.setAttribute('data-current', '');
            statusOriginais[statusId] = novoStatus;

            const thumbs = document.getElementById(thumbsId);
            if (thumbs) {
                thumbs.classList.add('show');
                setTimeout(() => {
                    thumbs.classList.remove('show');
                }, 2000);
            }

            carregarProcessos(obterFiltrosAtuais());
        }

        function resetarStatus(statusId) {
            const span = document.getElementById(statusId);
            if (!span) return;
            const original = span.getAttribute('data-original');
            if (original) {
                span.textContent = original.toUpperCase();
                span.setAttribute('data-current', '');
            }
        }

        function obterFiltrosAtuais() {
            return {
                dataInicio: document.getElementById('filtroDataInicio').value,
                dataFim: document.getElementById('filtroDataFim').value,
                dataRetirada: document.getElementById('filtroDataRetirada').value,
                armador: document.getElementById('filtroArmador').value,
                container: document.getElementById('filtroContainer').value,
                placa: document.getElementById('filtroPlaca').value,
                cargaPulmao: document.getElementById('filtroCargaPulmao').value,
                terminal: document.getElementById('filtroTerminal').value,
                cidade: document.getElementById('filtroCidade').value,
                transportadora: document.getElementById('filtroTransportadora').value,
                status: document.getElementById('filtroStatus').value
            };
        }

        function aplicarFiltros() {
            carregarProcessos(obterFiltrosAtuais());
        }

        function limparFiltros() {
            document.getElementById('filtroDataInicio').value = '';
            document.getElementById('filtroDataFim').value = '';
            document.getElementById('filtroDataRetirada').value = '';
            document.getElementById('filtroArmador').value = '';
            document.getElementById('filtroContainer').value = '';
            document.getElementById('filtroPlaca').value = '';
            document.getElementById('filtroCargaPulmao').value = '';
            document.getElementById('filtroTerminal').value = '';
            document.getElementById('filtroCidade').value = '';
            document.getElementById('filtroTransportadora').value = '';
            document.getElementById('filtroStatus').value = '';
            carregarProcessos({});
        }

        // Filtro automático APENAS para selects específicos
        document.getElementById('filtroCargaPulmao').addEventListener('change', aplicarFiltros);
        document.getElementById('filtroStatus').addEventListener('change', aplicarFiltros);

        // Funções de foto
        function abrirFoto(url) {
            img.src = url;
            scale = 1; transX = 0; transY = 0;
            updateTransform();
            document.getElementById('foto-modal').style.display = 'flex';
        }

        function fecharFoto() {
            document.getElementById('foto-modal').style.display = 'none';
        }

        function updateTransform() {
            containerImg.style.transform = `translate(${transX}px, ${transY}px) scale(${scale})`;
        }

        document.getElementById('foto-modal').addEventListener('wheel', (e) => {
            e.preventDefault();
            scale += e.deltaY * -0.001;
            scale = Math.min(Math.max(0.5, scale), 5);
            updateTransform();
        });

        containerImg.addEventListener('mousedown', (e) => { 
            isDragging = true; 
            startX = e.clientX - transX; 
            startY = e.clientY - transY; 
        });
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            transX = e.clientX - startX;
            transY = e.clientY - startY;
            updateTransform();
        });

        // Funções do modal de mapa
        function abrirMapa(query) {
            const iframe = document.getElementById('mapa-iframe');
            iframe.src = `https://www.google.com/maps?q=${query}&output=embed`;
            document.getElementById('mapa-modal').style.display = 'flex';
        }

        function fecharMapa() {
            document.getElementById('mapa-modal').style.display = 'none';
            document.getElementById('mapa-iframe').src = '';
        }

        // Fechar modal do mapa clicando fora da caixa
        document.getElementById('mapa-modal').addEventListener('click', function(e) {
            if (e.target === this) fecharMapa();
        });

        function exportarExcel() {
            if(dadosExportacao.length === 0) return alert("Sem dados para exportar");
            const ws = XLSX.utils.json_to_sheet(dadosExportacao);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Processos");
            XLSX.writeFile(wb, "Processos_Container.xlsx");
        }

        window.onload = () => carregarProcessos();
    </script>
</body>
</html>
