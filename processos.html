    .header-card {

<script>
  const FREE_TIME_RULES = {
    "PIL": { dias: 30, custo: 100 },
    "HAPAG LLOYD": { dias: 30, custo: 297 },
    "HAPAG": { dias: 30, custo: 297 },
    "ONE": { dias: 30, custo: 100 },
    "ALPHA SHIPPING": { dias: 30, custo: 100 },
    "ALPHA": { dias: 30, custo: 100 },
    "CMA CGM": { dias: 25, custo: 175 },
    "CMA": { dias: 25, custo: 175 },
    "YANG MING": { dias: 35, custo: 100 },
    "HMM": { dias: 42, custo: 100 },
    "MAERSK": { dias: 24, custo: 160 },
    "MSC": { dias: 30, custo: 130 },
    "COSCO": { dias: 35, custo: 100 },
    "EVERGREEN": { dias: 35, custo: 80 },
    "ZIM": { dias: 30, custo: 141 },
    "INTERTRANS - COSCO": { dias: 21, custo: 250 },
    "INTERTRANS - CMA CGM": { dias: 21, custo: 335 },
    "INTERTRANS - HMM": { dias: 21, custo: 360 },
    "INTERTRANS - YANG MING": { dias: 21, custo: 300 },
    "BR-X CARGO": { dias: 14, custo: 353 }
  };

  const STATUS_FLUXO = ['ag. carregamento', 'liberado', 'depositado'];
  const STORAGE_BASE = 'https://ekmcgifpvqrdgcikvepe.supabase.co/storage/v1/object/public/coletas-fotos/';
  const freeTimeCache = new Map();

  let dadosCompletos = [];
  let filtroStatusAtivo = null;
  let filtroFreeTimeAtivo = null;
  let filtroAtrasoAtivo = null;
  let filtroTransportadoraAtiva = null;
  let refreshInterval = null;
  const TAMANHO_PAGINA = 50;
  const COLUNAS_PROCESSOS = 'id,created_at,status,ordem,data_retirada,container,armador,transportadora,placa,carga_pulmao,tipo_carga,localizacao,foto_url,genset,liberado,depositado,finalizado';
  let paginaAtual = 0;
  let totalRegistros = 0;
  let usuarioConsulta = null;
  let consultaEmAndamento = false;
  let novaConsultaPendente = false;
  let ultimaConsulta = 0;
  let carregamentoInicial = true;
  let filtrosAplicados = null;
  let tentativaConsulta = 0;

  let fotoZoom = 1;
  let fotoPanX = 0;
  let fotoPanY = 0;
  let fotoIsDragging = false;
  let fotoDragStartX = 0;
  let fotoDragStartY = 0;
  let fotoStartPanX = 0;
  let fotoStartPanY = 0;
  let fotoTouchLastDist = null;
  let fotoTouchStartZoom = 1;

  function getFreeTimeRuleCached(armador) {
    if (!armador) return null;
    const nome = String(armador).trim().toUpperCase();
    if (freeTimeCache.has(nome)) return freeTimeCache.get(nome);
    // Prioridade ao nome mais específico: INTERTRANS - COSCO não pode herdar a regra COSCO.
    const regras = Object.entries(FREE_TIME_RULES)
      .sort((a, b) => b[0].length - a[0].length);
    const encontrada = regras.find(([key]) => nome === key.toUpperCase())
      || regras.find(([key]) => nome.includes(key.toUpperCase()));
    const regra = encontrada ? encontrada[1] : null;
    freeTimeCache.set(nome, regra);
    return regra;
  }

  function normalizarStatus(status) {
    const s = (status || '').toString().trim().toLowerCase();
    if (s === 'ag. locação' || s === 'ag. locacao' || s === 'ag. carregamento') return 'ag. carregamento';
    if (s === 'liberada') return 'liberado';
    if (s === 'depositado') return 'depositado';
    return s;
  }

  function getStatusColor(status) {
    const colors = {
      'ag. carregamento': '#FDE68A',
      'liberado': '#DBEAFE',
      'depositado': '#D1FAE5'
    };
    return colors[normalizarStatus(status)] || '#F3F4F6';
  }

  function showLoading() {
    const el = document.getElementById('loading-overlay');
    if (el) el.style.display = 'flex';
  }

  function hideLoading() {
    const el = document.getElementById('loading-overlay');
    if (el) el.style.display = 'none';
  }

  function getValue(id) {
    const el = document.getElementById(id);
    return el ? el.value : '';
  }

  async function verificarAcesso() {
    try {
      // prepararConsulta ja autentica, confere o perfil e guarda o contexto
      // para carregarProcessos. Evita repetir as mesmas duas requisicoes.
      return await prepararConsulta();
    } catch (error) {
      console.error('Erro em verificarAcesso:', error);
      alert('Erro ao verificar acesso.');
      window.location.href = 'index.html';
      return false;
    }
  }

  function formatarDataISO(iso) {
    if (!iso) return 'N/A';
    const date = iso.includes('T') ? new Date(iso) : new Date(iso + 'T00:00:00');
    if (isNaN(date.getTime())) return 'N/A';
    return date.toLocaleDateString('pt-BR');
  }

  function calcularDiasRestantes(dataRetirada, diasFreeTime) {
    if (!dataRetirada || !diasFreeTime) return null;
    const retirada = new Date(dataRetirada + 'T00:00:00');
    const agora = new Date();
    const diff = retirada.getTime() + (diasFreeTime * 86400000) - agora.getTime();
    return Math.ceil(diff / 86400000);
  }

  function getTipoBadgeClass(tipo) {
    const t = (tipo || '').toString().trim().toLowerCase();
    if (t === 'resfriado') return 'badge-resfriado';
    if (t === 'congelado com genset') return 'badge-congelado-genset';
    if (t === 'congelado') return 'badge-congelado';
    return 'badge-congelado';
  }

  function obterFiltroAtual() {
    return {
      dataInicio: getValue('filtroDataInicio'),
      dataFim: getValue('filtroDataFim'),
      dataRetirada: getValue('filtroDataRetirada'),
      armador: getValue('filtroArmador').trim().toLowerCase(),
      container: getValue('filtroContainer').trim().toLowerCase(),
      ordem: getValue('filtroOrdem').trim().toLowerCase(),
      placa: getValue('filtroPlaca').trim().toLowerCase(),
      cargaPulmao: getValue('filtroCargaPulmao'),
      tipoCarga: getValue('filtroTipoCarga'),
      transportadora: getValue('filtroTransportadora').trim().toLowerCase(),
      status: getValue('filtroStatus')
    };
  }

  function matchFilters(d, filtros, ignoreKey = null) {
    const statusNorm = normalizarStatus(d.status || 'ag. carregamento');

    if (ignoreKey !== 'container' && filtros.container && !(d.container || '').toLowerCase().includes(filtros.container)) return false;
    if (ignoreKey !== 'ordem' && filtros.ordem && !(d.ordem || '').toLowerCase().includes(filtros.ordem)) return false;
    if (ignoreKey !== 'armador' && filtros.armador && !(d.armador || '').toLowerCase().includes(filtros.armador)) return false;
    if (ignoreKey !== 'placa' && filtros.placa && !(d.placa || '').toLowerCase().includes(filtros.placa)) return false;
    if (ignoreKey !== 'status' && filtros.status && statusNorm !== filtros.status) return false;
    if (ignoreKey !== 'dataRetirada' && filtros.dataRetirada && d.data_retirada !== filtros.dataRetirada) return false;
    if (ignoreKey !== 'transportadora' && filtros.transportadora && !(d.transportadora || '').toLowerCase().includes(filtros.transportadora)) return false;
    if (ignoreKey !== 'tipoCarga' && filtros.tipoCarga && (d.tipo_carga || '') !== filtros.tipoCarga) return false;
    if (ignoreKey !== 'cargaPulmao' && filtros.cargaPulmao && d.carga_pulmao !== filtros.cargaPulmao) return false;

    if (filtros.dataInicio || filtros.dataFim) {
      const created = d.created_at ? new Date(d.created_at) : null;
      if (!created) return false;

      if (filtros.dataInicio && ignoreKey !== 'dataInicio') {
        const ini = new Date(filtros.dataInicio + 'T00:00:00');
        if (created < ini) return false;
      }
      if (filtros.dataFim && ignoreKey !== 'dataFim') {
        const fim = new Date(filtros.dataFim + 'T23:59:59');
        if (created > fim) return false;
      }
    }

    if (filtroStatusAtivo && ignoreKey !== 'status' && statusNorm !== filtroStatusAtivo) return false;

    if (filtroFreeTimeAtivo) {
      const rule = getFreeTimeRuleCached(d.armador);
      if (!rule || !d.data_retirada) return false;
      const rest = calcularDiasRestantes(d.data_retirada, rule.dias);
      if (rest === null) return false;
      const pct = ((rule.dias - rest) / rule.dias) * 100;
      const faixa = pct >= 100 ? '≥100%' : pct >= 76 ? '76-99%' : pct >= 51 ? '51-75%' : pct >= 26 ? '26-50%' : '0-25%';
      if (faixa !== filtroFreeTimeAtivo) return false;
    }

    if (filtroAtrasoAtivo) {
      const isDepositado = statusNorm === 'depositado' || d.finalizado;
      if (!isDepositado) return false;
      const rule = getFreeTimeRuleCached(d.armador);
      if (!rule || !d.data_retirada) return false;
      const rest = calcularDiasRestantes(d.data_retirada, rule.dias);
      const emAtraso = rest !== null && rest < 0;
      if (filtroAtrasoAtivo === 'em_atraso' && !emAtraso) return false;
      if (filtroAtrasoAtivo === 'no_prazo' && emAtraso) return false;
    }

    if (filtroTransportadoraAtiva && ignoreKey !== 'transportadora' && (d.transportadora || '').trim().toUpperCase() !== filtroTransportadoraAtiva.toUpperCase()) return false;

    return true;
  }

  function obterDadosFiltrados(ignoreKey = null) {
    const filtros = obterFiltroAtual();
    return dadosCompletos.filter(d => matchFilters(d, filtros, ignoreKey));
  }

  function atualizarDatalist(id, values) {
    const datalist = document.getElementById(id);
    if (!datalist) return;
    datalist.innerHTML = '';
    Array.from(new Set(values.filter(Boolean)))
      .sort((a, b) => String(a).localeCompare(String(b)))
      .forEach(v => {
        const opt = document.createElement('option');
        opt.value = v;
        datalist.appendChild(opt);
      });
  }

  function atualizarSelectDinamico(id, values, allLabel, selectedValue) {
    const select = document.getElementById(id);
    if (!select) return;

    const unique = Array.from(new Set(values.filter(Boolean))).sort((a, b) => String(a).localeCompare(String(b)));
    const current = selectedValue || '';

    select.innerHTML = `<option value="">${allLabel}</option>`;
    unique.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v;
      opt.textContent = v;
      if (v === current) opt.selected = true;
      select.appendChild(opt);
    });

    if (current && !unique.includes(current)) {
      const opt = document.createElement('option');
      opt.value = current;
      opt.textContent = current;
      opt.selected = true;
      select.appendChild(opt);
    }
  }

  function atualizarChips() {
    const chipArea = document.getElementById('chips-area');
    if (!chipArea) return;
    chipArea.innerHTML = '';
    const chips = [];
    if (filtroStatusAtivo) chips.push({ label: filtroStatusAtivo.toUpperCase(), key: 'status' });
    if (filtroFreeTimeAtivo) chips.push({ label: 'FT: ' + filtroFreeTimeAtivo, key: 'freeTime' });
    if (filtroAtrasoAtivo) chips.push({ label: filtroAtrasoAtivo === 'em_atraso' ? 'Dep. em Atraso' : 'Dep. no Prazo', key: 'atraso' });
    if (filtroTransportadoraAtiva) chips.push({ label: filtroTransportadoraAtiva, key: 'transp' });

    chips.forEach(c => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.innerHTML = `${c.label} <span>&times;</span>`;
      chip.onclick = () => {
        if (c.key === 'status') filtroStatusAtivo = null;
        else if (c.key === 'freeTime') filtroFreeTimeAtivo = null;
        else if (c.key === 'atraso') filtroAtrasoAtivo = null;
        else if (c.key === 'transp') filtroTransportadoraAtiva = null;
        aplicarFiltros();
      };
      chipArea.appendChild(chip);
    });
  }

  function atualizarFiltrosDinamicos() {
    // Sugestões da página atual. As opções dos selects não são apagadas.
    atualizarDatalist('listaArmador', dadosCompletos.map(d => d.armador || ''));
    atualizarDatalist('listaContainer', dadosCompletos.map(d => d.container || ''));
    atualizarDatalist('listaOrdem', dadosCompletos.map(d => d.ordem || ''));
    atualizarDatalist('listaPlaca', dadosCompletos.map(d => d.placa || ''));
    atualizarDatalist('listaTransportadora', dadosCompletos.map(d => d.transportadora || ''));
  }

  function fotoLink(url, titulo) {
    return url ? `<button type="button" class="loc-link" style="background:none;border:none" data-foto="${escaparHtml(url)}" data-titulo="${escaparHtml(titulo)}">${escaparHtml(titulo)}</button>` : '-';
  }

  function escaparHtml(valor) {
    return String(valor ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function obterConsultaBase(filtros, contar = false) {
    let q = clienteSupabase.from('coletas').select(COLUNAS_PROCESSOS, contar ? { count: 'exact' } : undefined);
    // A filtragem por transportadora no servidor é mantida, além das políticas RLS.
    if (!usuarioConsulta.ehAdmin) q = q.eq('transportadora', usuarioConsulta.transportadora);
    const texto = (campo, valor) => {
      if (valor) q = q.ilike(campo, `%${valor.replace(/[%,()]/g, '')}%`);
    };
    texto('container', filtros.container);
    texto('ordem', filtros.ordem);
    texto('armador', filtros.armador);
    texto('placa', filtros.placa);
    texto('transportadora', filtros.transportadora);
    if (filtros.dataRetirada) q = q.eq('data_retirada', filtros.dataRetirada);
    if (filtros.cargaPulmao) q = q.eq('carga_pulmao', filtros.cargaPulmao);
    if (filtros.tipoCarga) q = q.eq('tipo_carga', filtros.tipoCarga);
    if (filtros.dataInicio) q = q.gte('created_at', `${filtros.dataInicio}T00:00:00`);
    if (filtros.dataFim) {
      const fim = new Date(`${filtros.dataFim}T00:00:00`);
      fim.setDate(fim.getDate() + 1);
      q = q.lt('created_at', `${fim.getFullYear()}-${String(fim.getMonth()+1).padStart(2,'0')}-${String(fim.getDate()).padStart(2,'0')}T00:00:00`);
    }
    const status = filtros.status || filtroStatusAtivo;
    if (status === 'ag. carregamento') {
      q = q.in('status', ['ag. carregamento', 'ag. locação', 'ag. locacao']);
    } else if (status === 'liberado') {
      q = q.in('status', ['liberado', 'liberada']);
    } else if (status) q = q.eq('status', status);
    return q;
  }

  async function prepararConsulta() {
    if (usuarioConsulta) return true;
    if (!clienteSupabase) throw new Error('Cliente Supabase indisponível.');
    const { data: { user }, error: erroAuth } = await clienteSupabase.auth.getUser();
    if (erroAuth) throw erroAuth;
    if (!user) { window.location.href = 'login.html'; return false; }
    const { data: ud, error } = await clienteSupabase.from('usuarios')
      .select('perfil,status,transportadora').eq('email', user.email).single();
    if (error) throw error;
    const perfil = (ud?.perfil || '').trim().toLowerCase();
    const status = (ud?.status || '').trim().toLowerCase();
    const ehAdmin = ['master','mestre'].includes(perfil) || (perfil === 'administrador' && (!status || status === 'aprovado'));
    if (!ehAdmin && !ud?.transportadora?.trim()) throw new Error('Usuário sem autorização para consultar processos.');
    usuarioConsulta = {ehAdmin, transportadora:ud?.transportadora?.trim() || ''};
    return true;
  }

  function atualizarPaginacao() {
    const maxPagina = Math.max(1, Math.ceil(totalRegistros / TAMANHO_PAGINA));
    document.getElementById('pagina-info').textContent = `Página ${paginaAtual+1} de ${maxPagina} • ${totalRegistros.toLocaleString('pt-BR')} registros`;
    document.getElementById('pagina-anterior').disabled = paginaAtual === 0 || consultaEmAndamento;
    document.getElementById('pagina-proxima').disabled = paginaAtual >= maxPagina-1 || consultaEmAndamento;
    if (ultimaConsulta) document.getElementById('consulta-feedback').textContent = `Exibindo ${dadosCompletos.length} registro(s) nesta página • Última consulta ${new Date(ultimaConsulta).toLocaleTimeString('pt-BR')}`;
  }

  async function carregarProcessos() {
    if (consultaEmAndamento) { novaConsultaPendente = true; return; }
    consultaEmAndamento = true;
    const pedido = ++tentativaConsulta;
    const feedback = document.getElementById('consulta-feedback');
    feedback.textContent = 'Consultando processos no Supabase...';
    try {
      if (!(await prepararConsulta())) return;
      // Os filtros são capturados no momento da consulta; nenhum histórico é descartado.
      const filtros = filtrosAplicados || obterFiltroAtual();
      const inicio = paginaAtual*TAMANHO_PAGINA;
      const { data, count, error } = await obterConsultaBase(filtros, true)
        .order('created_at', { ascending:false })
        .order('id', { ascending:false })
        .range(inicio, inicio+TAMANHO_PAGINA-1);
      if (error) throw error;
      if (pedido !== tentativaConsulta) return;
      dadosCompletos = data || [];
      totalRegistros = count ?? dadosCompletos.length;
      if (paginaAtual && totalRegistros && inicio >= totalRegistros) {
        paginaAtual = Math.max(0, Math.ceil(totalRegistros/TAMANHO_PAGINA)-1);
        novaConsultaPendente = true;
      }
      ultimaConsulta = Date.now();
      atualizarTudo();
    } catch (erro) {
      console.error('Falha na consulta de processos:', erro);
      feedback.textContent = 'Falha ao consultar: ' + (erro?.message || erro) + '. Clique em Filtrar para tentar novamente.';
    } finally {
      consultaEmAndamento = false;
      if (carregamentoInicial) { hideLoading(); carregamentoInicial = false; }
      atualizarPaginacao();
      if (novaConsultaPendente) {
        novaConsultaPendente = false;
        carregarProcessos();
      }
    }
  }

  function renderGraficos() { return; }

  function renderTabela(dados) {
    const tbody = document.getElementById('table-body');
    tbody.innerHTML = '';

    if (dados.length === 0) {
      tbody.innerHTML = '<tr><td colspan="17" class="sem-dados">Nenhum container encontrado.</td></tr>';
      return;
    }

    const linhas = dados.map(d => {
      const rule = getFreeTimeRuleCached(d.armador);
      const diasTotal = rule ? rule.dias : '-';
      const diasRest = rule && d.data_retirada ? calcularDiasRestantes(d.data_retirada, rule.dias) : null;
      const vencido = diasRest !== null && diasRest < 0;
      const statusNorm = normalizarStatus(d.status || 'ag. carregamento');
      const statusText = statusNorm.toUpperCase();
      const statusColor = getStatusColor(statusNorm);

      const fotoUrl = d.foto_url ? `${STORAGE_BASE}${d.foto_url}` : null;
      const fotoGenset1Url = d.genset ? `${STORAGE_BASE}${d.genset}` : null;
      const fotoGenset2Url = d.liberado ? `${STORAGE_BASE}${d.liberado}` : null;
      const fotoGenset3Url = d.depositado ? `${STORAGE_BASE}${d.depositado}` : null;

      const loc = d.localizacao || 'N/A';
      const localizacaoHtml = (loc !== 'N/A' && loc !== 'GPS Bloqueado' && loc !== 'Sem GPS')
        ? `<button type="button" class="loc-link" data-mapa="${escaparHtml(encodeURIComponent(loc))}" style="background:none;border:none">📍 Local</button>`
        : escaparHtml(loc);

      const tipoCarga = d.tipo_carga || 'N/A';
      const tipoBadgeClass = getTipoBadgeClass(tipoCarga);

      return `
        <tr>
          <td class="col-nowrap">
            <span class="status-badge" style="background-color:${statusColor};">${statusText}</span>
          </td>
          <td>${escaparHtml(d.ordem || 'N/A')}</td>
          <td class="col-nowrap">${d.data_retirada ? formatarDataISO(d.data_retirada) : 'N/A'}</td>
          <td>${escaparHtml(d.container || 'N/A')}</td>
          <td>${escaparHtml(d.armador || 'N/A')}</td>
          <td>${escaparHtml(d.transportadora || 'N/A')}</td>
          <td>${escaparHtml(d.placa || 'N/A')}</td>
          <td><span class="badge-tipo ${d.carga_pulmao === 'Carga' ? 'badge-resfriado' : 'badge-congelado'}">${escaparHtml(d.carga_pulmao || 'N/A')}</span></td>
          <td><span class="badge-tipo ${tipoBadgeClass}">${escaparHtml(tipoCarga)}</span></td>
          <td>${diasTotal}</td>
          <td>${diasRest !== null ? diasRest : '-'}</td>
          <td class="${vencido ? 'vencido-sim' : 'vencido-nao'}">${vencido ? 'SIM' : 'NÃO'}</td>
          <td>${localizacaoHtml}</td>
          <td>${fotoLink(fotoUrl, 'RIC')}</td>
          <td>${fotoLink(fotoGenset1Url, 'AG. CARREGAMENTO')}</td>
          <td>${fotoLink(fotoGenset2Url, 'LIBERADO')}</td>
          <td>${fotoLink(fotoGenset3Url, 'DEPOSITADO')}</td>
        </tr>
      `;
    });
    tbody.innerHTML = linhas.join('');
  }

  function atualizarTudo() {
    const dados = dadosCompletos;
    atualizarChips();
    atualizarFiltrosDinamicos();
    renderGraficos(dados);
    renderTabela(dados);
  }

  function aplicarFiltros() {
    filtrosAplicados = obterFiltroAtual();
    paginaAtual = 0;
    carregarProcessos();
  }

  function limparFiltros() {
    document.querySelectorAll('.filter-bar input, .filter-bar select').forEach(el => {
      if (el.tagName === 'SELECT') el.selectedIndex = 0;
      else el.value = '';
    });
    filtroStatusAtivo = null;
    filtroFreeTimeAtivo = null;
    filtroAtrasoAtivo = null;
    filtroTransportadoraAtiva = null;
    filtrosAplicados = obterFiltroAtual();
    paginaAtual = 0;
    carregarProcessos();
  }

  async function exportarExcel() {
    try {
      if (!(await prepararConsulta())) return;
      const filtros = filtrosAplicados || obterFiltroAtual();
      const dados = [];
      const LOTE = 500;
      document.getElementById('consulta-feedback').textContent = 'Preparando exportação Excel...';
      for (let inicio=0; ; inicio+=LOTE) {
        const {data, error} = await obterConsultaBase(filtros)
          .order('created_at', {ascending:false}).order('id', {ascending:false}).range(inicio, inicio+LOTE-1);
        if (error) throw error;
        dados.push(...(data||[]));
        if (!data || data.length < LOTE) break;
        if (dados.length >= 30000) throw new Error('Exportação superior a 30.000 registros: utilize filtros mais específicos.');
      }
      if (dados.length === 0) {
        alert('Nenhum dado para exportar.');
        return;
      }

      const exportData = dados.map(d => {
        const rule = getFreeTimeRuleCached(d.armador);
        const diasRest = rule && d.data_retirada ? calcularDiasRestantes(d.data_retirada, rule.dias) : null;
        const vencido = diasRest !== null && diasRest < 0;

        return {
          Status: normalizarStatus(d.status).toUpperCase(),
          ORDEM: d.ordem || '',
          Retirada: d.data_retirada ? formatarDataISO(d.data_retirada) : '',
          Container: d.container || '',
          Armador: d.armador || '',
          Transportadora: d.transportadora || '',
          Placa: d.placa || '',
          'Carga/Pulmão': d.carga_pulmao || '',
          'Tipo de Carga': d.tipo_carga || '',
          'FT Total': rule ? rule.dias : '',
          'Dias Rest': diasRest,
          Vencido: vencido ? 'SIM' : 'NÃO',
          Localização: d.localizacao || '',
          RIC: d.foto_url || '',
          'AG. CARREGAMENTO': d.genset || '',
          LIBERADO: d.liberado || '',
          DEPOSITADO: d.depositado || ''
        };
      });

      const ws = XLSX.utils.json_to_sheet(exportData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Containers');
      XLSX.writeFile(wb, 'Processos_Container.xlsx');
      atualizarPaginacao();
    } catch (error) {
      console.error('Erro ao exportar Excel:', error);
      document.getElementById('consulta-feedback').textContent = 'Erro na exportação: ' + (error?.message || error);
    }
  }

  function aplicarTransformFoto() {
    const img = document.getElementById('foto-ampliada');
    if (!img) return;
    img.style.transform = `translate(${fotoPanX}px, ${fotoPanY}px) scale(${fotoZoom})`;
  }

  function ajustarFotoParaTela() {
    const img = document.getElementById('foto-ampliada');
    const stage = document.getElementById('container-img');
    if (!img || !stage || !img.naturalWidth || !img.naturalHeight) return;

    const maxW = Math.floor(window.innerWidth * 0.92);
    const maxH = Math.floor(window.innerHeight * 0.82);
    const ratio = img.naturalWidth / img.naturalHeight;

    let w = maxW;
    let h = Math.floor(w / ratio);

    if (h > maxH) {
      h = maxH;
      w = Math.floor(h * ratio);
    }

    w = Math.max(180, w);
    h = Math.max(180, h);

    stage.style.width = w + 'px';
    stage.style.height = h + 'px';

    fotoZoom = 1;
    fotoPanX = 0;
    fotoPanY = 0;
    aplicarTransformFoto();
  }

  function resetarZoomFoto() {
    fotoZoom = 1;
    fotoPanX = 0;
    fotoPanY = 0;
    aplicarTransformFoto();
  }

  function zoomFoto(delta) {
    const novoZoom = Math.max(1, Math.min(5, fotoZoom + delta));
    fotoZoom = novoZoom;
    if (fotoZoom === 1) {
      fotoPanX = 0;
      fotoPanY = 0;
    }
    aplicarTransformFoto();
  }

  function iniciarDragFoto(e) {
    if (fotoZoom <= 1) return;
    fotoIsDragging = true;
    fotoDragStartX = e.clientX;
    fotoDragStartY = e.clientY;
    fotoStartPanX = fotoPanX;
    fotoStartPanY = fotoPanY;
    e.preventDefault();
  }

  function moverDragFoto(e) {
    if (!fotoIsDragging) return;
    fotoPanX = fotoStartPanX + (e.clientX - fotoDragStartX);
    fotoPanY = fotoStartPanY + (e.clientY - fotoDragStartY);
    aplicarTransformFoto();
  }

  function finalizarDragFoto() {
    fotoIsDragging = false;
  }

  function getDistanceTouch(t1, t2) {
    const dx = t1.clientX - t2.clientX;
    const dy = t1.clientY - t2.clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function iniciarPinchFoto(e) {
    if (e.touches.length === 2) {
      fotoTouchLastDist = getDistanceTouch(e.touches[0], e.touches[1]);
      fotoTouchStartZoom = fotoZoom;
    }
  }

  function moverPinchFoto(e) {
    if (e.touches.length === 2 && fotoTouchLastDist) {
      const newDist = getDistanceTouch(e.touches[0], e.touches[1]);
      const ratio = newDist / fotoTouchLastDist;
      fotoZoom = Math.max(1, Math.min(5, fotoTouchStartZoom * ratio));
      if (fotoZoom === 1) {
        fotoPanX = 0;
        fotoPanY = 0;
      }
      aplicarTransformFoto();
      e.preventDefault();
    }
  }

  function finalizarPinchFoto() {
    fotoTouchLastDist = null;
  }

  function abrirFoto(url, titulo) {
    const img = document.getElementById('foto-ampliada');
    const modal = document.getElementById('foto-modal');
    const title = document.getElementById('foto-titulo');
    const stage = document.getElementById('container-img');
    if (!img || !modal || !title || !stage) return;

    modal.style.display = 'flex';
    title.textContent = titulo || '';

    img.onload = () => {
      requestAnimationFrame(() => ajustarFotoParaTela());
    };

    img.src = url;

    setTimeout(() => {
      if (img.complete) ajustarFotoParaTela();
    }, 120);
  }

  function fecharFoto() {
    const modal = document.getElementById('foto-modal');
    if (modal) modal.style.display = 'none';
    resetarZoomFoto();
    const img = document.getElementById('foto-ampliada');
    if (img) {
      img.src = '';
      img.onload = null;
    }
  }

  function abrirMapa(query) {
    const iframe = document.getElementById('mapa-iframe');
    const modal = document.getElementById('mapa-modal');
    if (!iframe || !modal) return;
    iframe.src = `https://www.google.com/maps?q=${query}&output=embed`;
    modal.style.display = 'flex';
  }

  function fecharMapa() {
    const modal = document.getElementById('mapa-modal');
    const iframe = document.getElementById('mapa-iframe');
    if (modal) modal.style.display = 'none';
    if (iframe) iframe.src = '';
  }

  function fecharModalDeposito() {
    const modal = document.getElementById('modal-data-deposito');
    if (modal) modal.style.display = 'none';
  }

  function confirmarDataDeposito() {
    fecharModalDeposito();
  }

  window.addEventListener('click', function(e) {
    if (e.target === document.getElementById('foto-modal')) fecharFoto();
    if (e.target === document.getElementById('mapa-modal')) fecharMapa();
    if (e.target === document.getElementById('modal-data-deposito')) fecharModalDeposito();
  });

  window.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      fecharFoto();
      fecharMapa();
      fecharModalDeposito();
    }
  });

  document.addEventListener('DOMContentLoaded', async () => {
    showLoading();
    try {
      const ok = await verificarAcesso();
      if (!ok) return;

      await carregarProcessos();

      const fotoStage = document.getElementById('container-img');
      const fotoImg = document.getElementById('foto-ampliada');

      if (fotoStage) {
        fotoStage.addEventListener('wheel', function(e) {
          e.preventDefault();
          const delta = e.deltaY < 0 ? 0.15 : -0.15;
          zoomFoto(delta);
        }, { passive: false });

        fotoStage.addEventListener('mousedown', iniciarDragFoto);
        window.addEventListener('mousemove', moverDragFoto);
        window.addEventListener('mouseup', finalizarDragFoto);

        fotoStage.addEventListener('touchstart', function(e) {
          if (e.touches.length === 1 && fotoZoom > 1) {
            fotoIsDragging = true;
            fotoDragStartX = e.touches[0].clientX;
            fotoDragStartY = e.touches[0].clientY;
            fotoStartPanX = fotoPanX;
            fotoStartPanY = fotoPanY;
          }
          if (e.touches.length === 2) {
            iniciarPinchFoto(e);
          }
        }, { passive: false });

        fotoStage.addEventListener('touchmove', function(e) {
          if (e.touches.length === 1 && fotoIsDragging) {
            fotoPanX = fotoStartPanX + (e.touches[0].clientX - fotoDragStartX);
            fotoPanY = fotoStartPanY + (e.touches[0].clientY - fotoDragStartY);
            aplicarTransformFoto();
            e.preventDefault();
          } else if (e.touches.length === 2) {
            moverPinchFoto(e);
          }
        }, { passive: false });

        fotoStage.addEventListener('touchend', function() {
          fotoIsDragging = false;
          finalizarPinchFoto();
        });
      }

      if (fotoImg) {
        fotoImg.addEventListener('dblclick', function() {
          if (fotoZoom === 1) zoomFoto(1);
          else resetarZoomFoto();
        });
      }

      if (refreshInterval) clearInterval(refreshInterval);
      refreshInterval = setInterval(() => {
        if (document.visibilityState === 'visible' && Date.now() - ultimaConsulta >= 60000) {
          carregarProcessos();
        }
      }, 60000);

      atualizarFiltrosDinamicos();
    } finally {
      hideLoading();
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && Date.now() - ultimaConsulta > 15000) {
      carregarProcessos();
    }
  });

  const debounceConsulta = (() => {
    let t;
    return () => { clearTimeout(t); t = setTimeout(aplicarFiltros, 450); };
  })();
  for (const id of ['filtroDataInicio','filtroDataFim','filtroDataRetirada','filtroCargaPulmao','filtroTipoCarga','filtroStatus']) {
    document.getElementById(id).addEventListener('change', aplicarFiltros);
  }
  for (const id of ['filtroArmador','filtroContainer','filtroOrdem','filtroPlaca','filtroTransportadora']) {
    document.getElementById(id).addEventListener('input', debounceConsulta);
  }
  document.getElementById('pagina-anterior').addEventListener('click', () => {
    if (paginaAtual > 0) { paginaAtual--; carregarProcessos(); }
  });
  document.getElementById('pagina-proxima').addEventListener('click', () => {
    if ((paginaAtual+1)*TAMANHO_PAGINA < totalRegistros) { paginaAtual++; carregarProcessos(); }
  });
  document.getElementById('table-body').addEventListener('click', e => {
    const foto = e.target.closest('[data-foto]');
    if (foto) { abrirFoto(foto.dataset.foto, foto.dataset.titulo); return; }
    const mapa = e.target.closest('[data-mapa]');
    if (mapa) abrirMapa(mapa.dataset.mapa);
  });
</script>
<script src="js/i18n-global.js"></script><script src="js/navigation-fast.js" defer></script></body>
</html>
