<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Registro | ColetaWeb</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .option-buttons-container {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
        }
        .btn-option {
            flex: 1;
            padding: 10px 16px;
            border-radius: 99px;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            cursor: pointer;
            border: 2px solid var(--gold);
            background: transparent;
            color: var(--navy);
            transition: all 0.2s;
            text-align: center;
        }
        .btn-option.active {
            background: var(--navy);
            color: white;
            border-color: var(--navy);
        }
        .btn-option:hover {
            background: #f0f0f0;
        }
        .btn-option.active:hover {
            background: var(--navy);
        }

        .form-group label {
            text-align: center;
            display: block;
        }

        .btn-salvar-loading {
            opacity: 0.7;
            pointer-events: none;
        }
    </style>
</head>
<body style="display: flex; justify-content: center; padding: 40px;">

    <div class="card" style="width: 550px;">
        <h2 style="color: var(--navy); margin-bottom: 20px; text-align: center;">NOVO REGISTRO</h2>
        
        <div class="form-group">
            <label>TIPO DE CARGA</label>
            <div class="option-buttons-container">
                <button id="btnResfriado" class="btn-option" onclick="selecionarTipoCarga('Resfriado', this)">Resfriado</button>
                <button id="btnCongelado" class="btn-option" onclick="selecionarTipoCarga('Congelado', this)">Congelado</button>
                <button id="btnCongeladoGenSet" class="btn-option" onclick="selecionarTipoCarga('Congelado com GenSet', this)">Congelado com GenSet</button>
            </div>
        </div>

        <div class="form-group">
            <label>CARGA OU PULMÃO</label>
            <div class="option-buttons-container">
                <button id="btnCarga" class="btn-option" onclick="selecionarCargaPulmao('Carga', this)">Carga</button>
                <button id="btnPulmao" class="btn-option" onclick="selecionarCargaPulmao('Pulmão', this)">Pulmão</button>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
            <div class="form-group">
                <label>DATA DA RETIRADA</label>
                <input type="date" id="dataRetirada">
            </div>
            <div class="form-group">
                <label>ARMADOR</label>
                <select id="armador">
                    <option value="">SELECIONE...</option>
                    <option value="PIL">PIL</option>
                    <option value="HAPAG LLOYD">HAPAG LLOYD</option>
                    <option value="ONE">ONE</option>
                    <option value="ALPHA SHIPPING">ALPHA SHIPPING</option>
                    <option value="CMA CGM">CMA CGM</option>
                    <option value="YANG MING">YANG MING</option>
                    <option value="HMM">HMM</option>
                    <option value="MAERSK">MAERSK</option>
                    <option value="MSC">MSC</option>
                    <option value="COSCO">COSCO</option>
                    <option value="EVERGREEN">EVERGREEN</option>
                    <option value="ZIM">ZIM</option>
                    <option value="INTERTRANS">INTERTRANS</option>
                    <option value="BR-X CARGO">BR-X CARGO</option>
                </select>
            </div>
            <div class="form-group">
                <label>PLACA</label>
                <input type="text" id="placa" placeholder="Digite a placa">
            </div>
            <div class="form-group">
                <label>CIDADE</label>
                <input type="text" id="cidade" placeholder="Ex: Santos, Rio de Janeiro...">
            </div>
            <div class="form-group">
                <label>TERMINAL DE COLETA</label>
                <input type="text" id="terminalColeta" placeholder="Ex: Lechman, VMG...">
            </div>
            <div class="form-group">
                <label>CONTAINER</label>
                <input type="text" id="containerInput" placeholder="Digite o número do container">
            </div>
            <div class="form-group">
                <label>TARA</label>
                <input type="text" id="tara" placeholder="Ex: 4730">
            </div>
            <div class="form-group">
                <label>MAX GROSS</label>
                <input type="text" id="maxGross" placeholder="Ex: 35000">
            </div>
        </div>

        <div class="form-group" style="border-top: 1px solid #eee; padding-top: 20px;">
            <label id="labelRic">TIRAR FOTO (RIC)</label>
            <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
            <button type="button" class="btn-main" onclick="document.getElementById('cameraInput').click()" 
                    style="background: var(--gold); padding: 10px 20px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 99px; margin-bottom: 10px;">
                <span style="font-size: 20px;">📷</span> TIRAR FOTO (RIC)
            </button>
            <div id="status" style="font-size: 12px; color: var(--red); font-weight: bold; margin-top:5px;"></div>
            <img id="preview" style="max-width: 100%; margin-top: 10px; display: none; border-radius: 10px; border: 1px solid var(--gold);">

            <div id="genset-section" style="display: none; margin-top: 15px;">
                <label id="labelGenset">TIRAR FOTO (PAINEL GENSET)</label>
                <input type="file" id="gensetInput" accept="image/*" capture="environment" style="display: none;">
                <button type="button" id="btnGensetCapture" class="btn-main" onclick="document.getElementById('gensetInput').click()" 
                        style="background: var(--gold); padding: 10px 20px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 99px; margin-bottom: 10px;">
                    <span style="font-size: 20px;">📷</span> TIRAR FOTO (PAINEL GENSET)
                </button>
                <img id="gensetPreview" style="max-width: 100%; margin-top: 10px; display: none; border-radius: 10px; border: 1px solid var(--gold);">
            </div>
        </div>
        
        <div style="margin-top: 20px; display: flex; gap: 10px;">
            <button class="btn-main" style="background: #6c757d; padding: 10px 20px;" onclick="window.location.href='index.html'">VOLTAR</button>
            <button class="btn-main" id="btnSalvar" style="background: #E84D53; padding: 10px 20px;" onclick="salvarColeta()">SALVAR</button>
        </div>
    </div>

    <div id="custom-alert" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:9999; justify-content:center; align-items:center;">
        <div style="background:white; padding:30px 40px; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,0.3); text-align:center; max-width:350px; width:90%;">
            <p style="font-size:1.2rem; font-weight:bold; color:#2d4b5e; margin-bottom:20px;" id="custom-alert-msg">Registro salvo com sucesso!</p>
            <button onclick="fecharAlerta()" style="background: #2d4b5e; color:white; border:none; padding:10px 30px; border-radius:99px; font-weight:bold; cursor:pointer; text-transform:uppercase;">OK</button>
        </div>
    </div>

    <div id="modal-data-deposito" style="display:none; position:fixed; z-index:3000; inset:0; background:rgba(0,0,0,0.7); justify-content:center; align-items:center;">
        <div style="background:white; padding:30px 35px; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,0.3); text-align:center; border:1px solid var(--gold);">
            <p style="font-weight:700; margin-bottom:15px; color:var(--navy); font-size:18px;">Selecione a data do depósito</p>
            <input type="date" id="input-data-deposito" style="padding:10px 15px; border-radius:10px; border:1px solid var(--navy); font-weight:600; font-size:16px; text-align:center; outline:none;">
            <div style="margin-top:20px; display:flex; gap:10px; justify-content:center;">
                <button class="btn-main" style="background:#6c757d; padding:10px 20px;" onclick="fecharModalDeposito()">Cancelar</button>
                <button class="btn-main" style="background:var(--navy); padding:10px 20px;" onclick="confirmarDataDeposito()">Confirmar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    
    <script>
        let tipoCargaSelecionado = '';
        let cargaPulmaoSelecionado = '';
        let salvando = false;

        let etapaFluxo = 'ric'; // ric -> painel_ag -> painel_lib -> painel_dep -> final
        let registroId = null;
        let fotoPendenteNome = null;

        function tipoUsaFluxoCompleto() {
            return tipoCargaSelecionado === 'Resfriado' || tipoCargaSelecionado === 'Congelado com GenSet';
        }

        function atualizarInterfaceEtapa() {
            const gensetSection = document.getElementById('genset-section');
            const labelGenset = document.getElementById('labelGenset');
            const btnSalvar = document.getElementById('btnSalvar');
            const btnGensetCapture = document.getElementById('btnGensetCapture');
            const status = document.getElementById('status');
            const preview = document.getElementById('gensetPreview');

            if (!tipoUsaFluxoCompleto()) {
                gensetSection.style.display = 'none';
                status.innerText = '';
                btnSalvar.innerText = 'SALVAR';
                labelGenset.innerText = 'TIRAR FOTO (PAINEL GENSET)';
                btnGensetCapture.innerHTML = '<span style="font-size: 20px;">📷</span> TIRAR FOTO (PAINEL GENSET)';
                return;
            }

            gensetSection.style.display = (etapaFluxo === 'ric') ? 'none' : 'block';

            if (etapaFluxo === 'painel_ag') {
                labelGenset.innerText = 'AG. CARREGAMENTO: Tirar FOTO (PAINEL GENSET)';
                status.innerText = 'AG. CARREGAMENTO: Tirar FOTO (PAINEL GENSET)';
            } else if (etapaFluxo === 'painel_lib') {
                labelGenset.innerText = 'STATUS: LIBERADO: Tirar FOTO (PAINEL GENSET)';
                status.innerText = 'STATUS: LIBERADO: Tirar FOTO (PAINEL GENSET)';
            } else if (etapaFluxo === 'painel_dep') {
                labelGenset.innerText = 'DEPOSITADO: Tirar FOTO (PAINEL GENSET)';
                status.innerText = 'DEPOSITADO: Tirar FOTO (PAINEL GENSET)';
            } else {
                labelGenset.innerText = 'TIRAR FOTO (PAINEL GENSET)';
                status.innerText = '';
            }

            btnGensetCapture.innerHTML = '<span style="font-size: 20px;">📷</span> TIRAR FOTO (PAINEL GENSET)';

            const hasGensetPhoto = !!document.getElementById('gensetInput').files[0];
            if (etapaFluxo === 'ric') {
                btnSalvar.innerText = 'SALVAR';
            } else {
                btnSalvar.innerText = hasGensetPhoto ? 'AVANÇAR E SALVAR' : 'SALVAR';
            }

            if (preview && !hasGensetPhoto) {
                preview.style.display = 'none';
            }
        }

        function selecionarTipoCarga(tipo, btn) {
            document.getElementById('btnResfriado').classList.remove('active');
            document.getElementById('btnCongelado').classList.remove('active');
            document.getElementById('btnCongeladoGenSet').classList.remove('active');
            btn.classList.add('active');
            tipoCargaSelecionado = tipo;

            document.getElementById('gensetInput').value = '';
            document.getElementById('gensetPreview').src = '';
            document.getElementById('gensetPreview').style.display = 'none';

            etapaFluxo = 'ric';
            registroId = null;
            fotoPendenteNome = null;
            atualizarInterfaceEtapa();
        }

        function selecionarCargaPulmao(valor, btn) {
            document.getElementById('btnCarga').classList.remove('active');
            document.getElementById('btnPulmao').classList.remove('active');
            btn.classList.add('active');
            cargaPulmaoSelecionado = valor;
        }

        document.getElementById('cameraInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('preview').src = event.target.result;
                    document.getElementById('preview').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('gensetInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const btnSalvar = document.getElementById('btnSalvar');
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('gensetPreview').src = event.target.result;
                    document.getElementById('gensetPreview').style.display = 'block';
                    if (etapaFluxo !== 'ric') {
                        btnSalvar.innerText = 'AVANÇAR E SALVAR';
                    }
                };
                reader.readAsDataURL(file);
            } else {
                document.getElementById('gensetPreview').style.display = 'none';
                if (etapaFluxo !== 'ric') btnSalvar.innerText = 'SALVAR';
            }
        });

        function mostrarAlerta(mensagem, callback) {
            document.getElementById('custom-alert-msg').textContent = mensagem;
            document.getElementById('custom-alert').style.display = 'flex';
            window._callbackAlerta = callback;
        }

        function fecharAlerta() {
            document.getElementById('custom-alert').style.display = 'none';
            if (typeof window._callbackAlerta === 'function') {
                window._callbackAlerta();
            }
        }

        function setSalvando(ativar) {
            const btn = document.getElementById('btnSalvar');
            if (ativar) {
                btn.innerText = 'SALVANDO...';
                btn.classList.add('btn-salvar-loading');
                btn.disabled = true;
                salvando = true;
            } else {
                btn.classList.remove('btn-salvar-loading');
                btn.disabled = false;
                salvando = false;
                if (tipoUsaFluxoCompleto() && etapaFluxo !== 'ric' && document.getElementById('gensetInput').files[0]) {
                    btn.innerText = 'AVANÇAR E SALVAR';
                } else {
                    btn.innerText = 'SALVAR';
                }
            }
        }

        async function uploadFoto(file, sufixo) {
            const { data: { user } } = await clienteSupabase.auth.getUser();
            const ext = (file.name && file.name.includes('.')) ? file.name.split('.').pop() : 'jpg';
            const fileName = `${Date.now()}_${user.email}_${registroId || 'novo'}_${sufixo}.${ext}`.replace(/[^a-zA-Z0-9._@-]/g, '_');

            const { error } = await clienteSupabase.storage
                .from('coletas-fotos')
                .upload(fileName, file, { upsert: true });

            if (error) throw error;
            return fileName;
        }

        async function salvarColeta() {
            if (salvando) return;

            if (typeof clienteSupabase === 'undefined') {
                mostrarAlerta("Erro: O sistema ainda está carregando.");
                return;
            }

            if (!tipoCargaSelecionado) return mostrarAlerta("Selecione o tipo de carga.");
            if (!cargaPulmaoSelecionado) return mostrarAlerta("Selecione se é Carga ou Pulmão.");

            const dataRetirada = document.getElementById('dataRetirada').value;
            if (!dataRetirada) return mostrarAlerta("Por favor, preencha a Data da Retirada.");

            const { data: { user } } = await clienteSupabase.auth.getUser();
            if (!user) return mostrarAlerta("Usuário não autenticado!");

            try {
                setSalvando(true);

                const armador = document.getElementById('armador').value;
                const placa = document.getElementById('placa').value;
                const tara = document.getElementById('tara').value;
                const maxGross = document.getElementById('maxGross').value;
                const terminalColeta = document.getElementById('terminalColeta').value;
                const cidade = document.getElementById('cidade').value;
                const containerFinal = document.getElementById('containerInput').value.trim() || "N/A";

                let localizacao = "Sem GPS";
                try {
                    const pos = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 10000 });
                    });
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`);
                    const data = await response.json();
                    
                    if (data && data.address) {
                        const addr = data.address;
                        const rua = addr.road || '';
                        const num = addr.house_number || '';
                        const bairro = addr.suburb || addr.neighbourhood || '';
                        const cidadeGps = addr.city || addr.town || '';
                        const estado = addr.state || addr.state_district || '';
                        localizacao = [rua, num, bairro, cidadeGps, estado].filter(Boolean).join(' - ');
                    } else {
                        localizacao = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
                    }
                } catch (e) {
                    console.warn("GPS bloqueado ou falhou:", e);
                    localizacao = "GPS Bloqueado";
                }

                const { data: userData } = await clienteSupabase
                    .from('usuarios')
                    .select('transportadora')
                    .eq('email', user.email)
                    .single();

                const fileInput = document.getElementById('cameraInput');
                if (!fileInput.files[0]) return mostrarAlerta("Tire a foto do recibo (RIC)!");

                // ETAPA 1: RIC -> cria registro com AG. CARREGAMENTO
                if (etapaFluxo === 'ric') {
                    const fileNameRIC = await uploadFoto(fileInput.files[0], 'ric');

                    const insertObj = {
                        email_usuario: user.email,
                        data_retirada: dataRetirada,
                        armador: armador,
                        container: containerFinal,
                        placa: placa,
                        tara: tara,
                        max_gross: maxGross,
                        carga_pulmao: cargaPulmaoSelecionado,
                        terminal_coleta: terminalColeta,
                        cidade: cidade,
                        foto_url: fileNameRIC,
                        localizacao: localizacao,
                        transportadora: userData ? userData.transportadora : "N/A",
                        status: 'ag. carregamento',
                        finalizado: false,
                        tipo_carga: tipoCargaSelecionado,
                        created_at: new Date().toISOString()
                    };

                    const { data: inserted, error: dbError } = await clienteSupabase.from('coletas').insert([insertObj]).select().single();
                    if (dbError) throw dbError;

                    registroId = inserted.id;

                    if (tipoUsaFluxoCompleto()) {
                        etapaFluxo = 'painel_ag';
                        document.getElementById('gensetInput').value = '';
                        document.getElementById('gensetPreview').src = '';
                        document.getElementById('gensetPreview').style.display = 'none';
                        atualizarInterfaceEtapa();
                        setSalvando(false);
                        return;
                    }

                    setSalvando(false);
                    mostrarAlerta("Registro salvo com sucesso!", function() {
                        window.location.href = 'index.html';
                    });
                    return;
                }

                const gensetInput = document.getElementById('gensetInput');
                if (!gensetInput.files[0]) return mostrarAlerta("Tire a foto do painel do genset.");

                if (!registroId) {
                    return mostrarAlerta("Erro: registro não encontrado. Salve a foto do RIC novamente.");
                }

                // ETAPA 2: painel_ag -> atualiza para LIBERADO
                if (etapaFluxo === 'painel_ag') {
                    const fileName = await uploadFoto(gensetInput.files[0], 'genset');
                    const { error } = await clienteSupabase
                        .from('coletas')
                        .update({ genset: fileName, status: 'liberado', finalizado: false })
                        .eq('id', registroId);
                    if (error) throw error;

                    etapaFluxo = 'painel_lib';
                    document.getElementById('gensetInput').value = '';
                    document.getElementById('gensetPreview').src = '';
                    document.getElementById('gensetPreview').style.display = 'none';
                    atualizarInterfaceEtapa();
                    setSalvando(false);
                    return;
                }

                // ETAPA 3: painel_lib -> atualiza para DEPOSITADO
                if (etapaFluxo === 'painel_lib') {
                    const fileName = await uploadFoto(gensetInput.files[0], 'liberado');
                    const { error } = await clienteSupabase
                        .from('coletas')
                        .update({ liberado: fileName, status: 'depositado', finalizado: false })
                        .eq('id', registroId);
                    if (error) throw error;

                    etapaFluxo = 'painel_dep';
                    document.getElementById('gensetInput').value = '';
                    document.getElementById('gensetPreview').src = '';
                    document.getElementById('gensetPreview').style.display = 'none';
                    atualizarInterfaceEtapa();
                    setSalvando(false);
                    return;
                }

                // ETAPA 4: painel_dep -> abre modal de data e finaliza ao confirmar
                if (etapaFluxo === 'painel_dep') {
                    const fileName = await uploadFoto(gensetInput.files[0], 'depositado');
                    fotoPendenteNome = fileName;

                    document.getElementById('gensetInput').value = '';
                    document.getElementById('gensetPreview').src = '';
                    document.getElementById('gensetPreview').style.display = 'none';
                    atualizarInterfaceEtapa();

                    document.getElementById('input-data-deposito').value = new Date().toISOString().split('T')[0];
                    document.getElementById('modal-data-deposito').style.display = 'flex';
                    setSalvando(false);
                    return;
                }

                setSalvando(false);
            } catch (err) {
                console.error(err);
                setSalvando(false);
                mostrarAlerta("Erro ao salvar: " + err.message);
                document.getElementById('status').innerText = 'Erro ao salvar.';
            }
        }

        function fecharModalDeposito() {
            document.getElementById('modal-data-deposito').style.display = 'none';
        }

        async function confirmarDataDeposito() {
            const dataEscolhida = document.getElementById('input-data-deposito').value;
            if (!dataEscolhida) return alert('Selecione uma data.');
            if (!registroId || !fotoPendenteNome) return alert('Erro: foto pendente não encontrada.');

            try {
                const { error } = await clienteSupabase.from('coletas').update({
                    status: 'depositado',
                    finalizado: true,
                    data_finalizado: new Date(dataEscolhida + 'T12:00:00').toISOString(),
                    depositado: fotoPendenteNome
                }).eq('id', registroId);

                if (error) throw error;

                fecharModalDeposito();
                etapaFluxo = 'final';
                mostrarAlerta("Registro salvo com sucesso!", function() {
                    window.location.href = 'index.html';
                });
            } catch (err) {
                console.error(err);
                mostrarAlerta("Erro ao salvar depósito: " + err.message);
            }
        }

        atualizarInterfaceEtapa();
    </script>
</body>
</html>
