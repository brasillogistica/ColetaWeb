<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Registro | ColetaWeb</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
</head>
<body style="display: flex; justify-content: center; padding: 40px;">

    <div class="card" style="width: 550px;">
        <h2 style="color: var(--navy); margin-bottom: 20px;">NOVO REGISTRO</h2>
        
        <!-- Campos Manuais -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
            <div class="form-group">
                <label>DATA DA RETIRADA</label>
                <input type="date" id="dataRetirada">
            </div>
            <div class="form-group">
                <label>CARGA OU PULMÃO</label>
                <select id="cargaPulmao">
                    <option value="">SELECIONE...</option>
                    <option value="Carga">Carga</option>
                    <option value="Pulmão">Pulmão</option>
                </select>
            </div>
            <div class="form-group">
                <label>ARMADOR</label>
                <input type="text" id="armador" placeholder="Digite o nome do armador">
            </div>
            <div class="form-group">
                <label>PLACA</label>
                <input type="text" id="placa" placeholder="Digite a placa">
            </div>
            <div class="form-group">
                <label>TARA</label>
                <input type="text" id="tara" placeholder="Ex: 4730">
            </div>
            <div class="form-group">
                <label>MAX GROSS</label>
                <input type="text" id="maxGross" placeholder="Ex: 35000">
            </div>
            <div class="form-group">
                <label>TERMINAL DE COLETA</label>
                <input type="text" id="terminalColeta" placeholder="Ex: Lechman, VMG...">
            </div>
            <div class="form-group">
                <label>CIDADE</label>
                <input type="text" id="cidade" placeholder="Ex: Santos, Rio de Janeiro...">
            </div>
            <div class="form-group" style="grid-column: 1 / -1;">
                <label>CONTAINER (Preenchido pelo OCR se você deixar vazio)</label>
                <input type="text" id="containerInput" placeholder="Digite aqui ou tire a foto">
            </div>
        </div>

        <!-- Campo de Câmera/Foto -->
        <div class="form-group" style="border-top: 1px solid #eee; padding-top: 20px;">
            <label>FOTO DO RECIBO</label>
            <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
            
            <button type="button" class="btn-main" onclick="document.getElementById('cameraInput').click()" 
                    style="background: var(--gold); padding: 10px 20px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 99px; margin-bottom: 10px;">
                <span style="font-size: 20px;">📷</span> TIRAR FOTO
            </button>
            
            <div id="status" style="font-size: 12px; color: var(--red); font-weight: bold; margin-top:5px;"></div>
            <img id="preview" style="max-width: 100%; margin-top: 10px; display: none; border-radius: 10px; border: 1px solid var(--gold);">
        </div>
        
        <div style="margin-top: 20px; display: flex; gap: 10px;">
            <button class="btn-main" style="background: #6c757d; padding: 10px 20px;" onclick="window.location.href='index.html'">VOLTAR</button>
            <button class="btn-main" id="btnSalvar" style="background: #E84D53; padding: 10px 20px;" onclick="salvarColeta()">SALVAR</button>
        </div>
    </div>

    <script src="script.js"></script>
    
    <script>
        window.dadosExtraidos = { container: "N/A" };

        // Lógica de captura e OCR CORRIGIDA
        document.getElementById('cameraInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = async function(event) {
                    document.getElementById('preview').src = event.target.result;
                    document.getElementById('preview').style.display = 'block';
                    
                    if(typeof window.processarOCR === 'function') {
                        await window.processarOCR(event.target.result);
                        
                        // CORREÇÃO AQUI: Só preenche se o usuário NÃO tiver digitado nada ainda
                        const inputContainer = document.getElementById('containerInput');
                        if (window.dadosExtraidos && window.dadosExtraidos.container && inputContainer.value.trim() === '') {
                            inputContainer.value = window.dadosExtraidos.container;
                        }
                    }
                }
                reader.readAsDataURL(file);
            }
        });

        async function salvarColeta() {
            if (typeof clienteSupabase === 'undefined') {
                alert("Erro: O sistema ainda está carregando.");
                return;
            }

            const dataRetirada = document.getElementById('dataRetirada').value;
            if(!dataRetirada) return alert("Por favor, preencha a Data da Retirada.");
            
            const cargaPulmao = document.getElementById('cargaPulmao').value;
            if(!cargaPulmao) return alert("Por favor, selecione entre Carga ou Pulmão.");
            
            const fileInput = document.getElementById('cameraInput');
            if (!fileInput.files[0]) { alert("Tire uma foto do recibo primeiro!"); return; }

            const status = document.getElementById('status');
            const { data: { user } } = await clienteSupabase.auth.getUser();
            
            if (!user) {
                alert("Usuário não autenticado!");
                return;
            }
            
            status.innerText = "Obtendo endereço e enviando...";

            try {
                // 1. Obter Localização
                let localizacao = "Sem GPS";
                try {
                    const pos = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 10000 });
                    });
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`);
                    const data = await response.json();
                    
                    if (data && data.address) {
                        const addr = data.address;
                        const rua = addr.road || '';
                        const num = addr.house_number || '';
                        const bairro = addr.suburb || addr.neighbourhood || '';
                        const cidade = addr.city || addr.town || '';
                        const estado = addr.state || addr.state_district || '';
                        localizacao = [rua, num, bairro, cidade, estado].filter(Boolean).join(' - ');
                    } else {
                        localizacao = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
                    }
                } catch (e) {
                    console.warn("GPS bloqueado ou falhou:", e);
                    localizacao = "GPS Bloqueado";
                }

                // 2. Busca transportadora do usuário
                const { data: userData } = await clienteSupabase
                    .from('usuarios')
                    .select('transportadora')
                    .eq('email', user.email)
                    .single();

                status.innerText = "Enviando foto...";

                // 3. Upload da foto
                const fileName = `${Date.now()}_${user.email}.jpg`;
                const { error: uploadError } = await clienteSupabase.storage
                    .from('coletas-fotos')
                    .upload(fileName, fileInput.files[0]);
                
                if (uploadError) throw uploadError;

                // 4. Coletando valores manuais e tratando o Container
                const armador = document.getElementById('armador').value;
                const placa = document.getElementById('placa').value;
                const tara = document.getElementById('tara').value;
                const maxGross = document.getElementById('maxGross').value;
                const terminalColeta = document.getElementById('terminalColeta').value;
                const cidade = document.getElementById('cidade').value;
                
                // CORREÇÃO NO SALVAMENTO: Prioriza o que o usuário digitou
                const inputContainerValue = document.getElementById('containerInput').value.trim();
                const containerFinal = inputContainerValue !== '' ? inputContainerValue : (window.dadosExtraidos.container || "N/A");

                // 5. Salvar no banco
                const { error: dbError } = await clienteSupabase.from('coletas').insert([{
                    email_usuario: user.email,
                    data_retirada: dataRetirada,
                    armador: armador,
                    container: containerFinal, // Salva o valor correto
                    placa: placa,
                    tara: tara,
                    max_gross: maxGross,
                    carga_pulmao: cargaPulmao,
                    terminal_coleta: terminalColeta,
                    cidade: cidade,
                    foto_url: fileName,
                    localizacao: localizacao,
                    transportadora: userData ? userData.transportadora : "N/A",
                    created_at: new Date().toISOString()
                }]);

                if (dbError) throw dbError;

                alert("Registro salvo com sucesso!");
                window.location.href = 'index.html';
            } catch (err) {
                console.error(err);
                alert("Erro ao salvar: " + err.message);
                status.innerText = "Erro ao salvar.";
            }
        }
    </script>
</body>
</html>
