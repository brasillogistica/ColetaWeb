<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Registro | ColetaWeb</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
</head>
<body style="display: flex; justify-content: center; padding: 40px;">

    <div class="card" style="width: 450px;">
        <h2 style="color: var(--navy); margin-bottom: 20px;">NOVO REGISTRO</h2>
        
        <div class="form-group"><label>Transportadora</label><input type="text" value="Dallastra" disabled></div>
        <div class="form-group"><label>Container</label><input type="text" id="cnt" placeholder="CONTAINER"></div>
        
        <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex: 1;"><label>Tara</label><input type="text" id="tara"></div>
            <div class="form-group" style="flex: 1;"><label>Max Gross</label><input type="text" id="gross"></div>
        </div>

        <div class="form-group"><label>Motorista</label><input type="text" id="motorista"></div>
        <div class="form-group"><label>Veículo</label><input type="text" id="veiculo"></div>
        <div class="form-group"><label>Lacre</label><input type="text" id="lacre"></div>

        <div class="form-group">
            <label>Armador</label>
            <select id="armadorSelect"><option value="">SELECIONE...</option></select>
        </div>

        <div class="form-group">
            <label>Local da Coleta</label>
            <select id="localColetaSelect"><option value="">SELECIONE...</option></select>
        </div>

        <div class="form-group">
            <label>FOTO DO RECIBO</label>
            <input type="file" id="cameraInput" accept="image/*" capture="environment" style="border: none; padding: 10px 0; font-size: 14px;">
            <div id="status" style="font-size: 12px; color: var(--red); font-weight: bold; margin-top:5px;"></div>
            <img id="preview" style="max-width: 100%; margin-top: 10px; display: none; border-radius: 10px; border: 1px solid var(--gold);">
        </div>
        
        <div style="margin-top: 20px; display: flex; gap: 10px;">
            <button class="btn-main" style="background: #6c757d; padding: 10px 20px;" onclick="window.location.href='index.html'">VOLTAR</button>
            <button class="btn-main" style="background: #E84D53; padding: 10px 20px;">SALVAR</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        popularArmadores();
        popularLocais();

        document.getElementById('cameraInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = async function(event) {
                    document.getElementById('preview').src = event.target.result;
                    document.getElementById('preview').style.display = 'block';
                    if(typeof window.processarOCR === 'function') {
                        await window.processarOCR(event.target.result);
                    }
                }
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
