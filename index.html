<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
    <title>Home | ColetaWeb</title>
    <style>
        /* Ajuste responsivo e controle de exibição do painel */
        @media (max-width: 768px) {
            .responsive-card { flex-direction: column !important; gap: 20px !important; }
            .side-col { flex: 0 0 100% !important; }
            .header-card { flex-direction: column; gap: 15px; text-align: center; }
            .header-left, .header-right { flex: 0 0 100% !important; text-align: center !important; }
        }
        /* Esconde o painel por padrão via CSS para evitar o efeito visual de pulo */
        #admin-container { display: none; }
    </style>
</head>
<body>
    <div class="card header-card" style="margin-bottom: 20px; display: flex; align-items: center; padding: 15px 25px;">
        <div class="header-left" style="flex: 0 0 150px; font-size: 20px; font-weight: 800; cursor: default;">
            <span style="color: var(--navy);">minerva</span><span style="color: var(--red);">foods</span>
        </div>
        <div style="flex: 1; text-align: center;">
            <h1 id="welcome-message" style="color: var(--navy); font-size: 1.5rem;">Carregando...</h1>
            <p style="font-size: 0.8rem;">Sistema ColetaWeb - Logística Internacional</p>
        </div>
        <div class="header-right" style="flex: 0 0 150px; text-align: right;">
            <button class="btn-main" onclick="fazerLogout()" style="background: white; border: 2px solid var(--red); color: var(--red); padding: 8px 15px; width: 100%; max-width: 100px; font-size: 10px;">SAIR</button>
        </div>
    </div>

    <div class="card responsive-card" style="display: flex; gap: 40px; align-items: flex-start;">
        <div class="side-col" style="flex: 0 0 250px; display: flex; flex-direction: column; gap: 15px;">
            <button class="btn-main" onclick="window.location.href='coleta.html'" style="width: 100%;">REGISTRAR COLETA</button>
            <button class="btn-main" style="width: 100%; background: var(--gold);" onclick="window.location.href='historico.html'">HISTÓRICO</button>
            <div id="admin-container" style="flex-direction: column; gap: 15px;">
                <button class="btn-main" style="width: 100%; background: var(--red);" onclick="window.location.href='admin.html'">GERENCIAMENTO</button>
                <button class="btn-main" style="width: 100%; background: var(--navy);" onclick="window.location.href='cadastro-transportadora.html'">CADASTRAR TRANSPORTADORA</button>
            </div>
        </div>

        <div class="side-col" style="flex: 1; display: flex; justify-content: flex-end;">
            <div style="width: 100%; max-width: 600px;">
                <div id="calendar-header" style="text-align: center; font-weight: 800; color: var(--navy); margin-bottom: 15px;"></div>
                <div id="calendar-grid" class="calendar-grid" style="margin-top: 0; width: 100%;">
                    <div class="cal-cell head">Nº</div>
                    <div class="cal-cell head">Seg</div>
                    <div class="cal-cell head">Ter</div>
                    <div class="cal-cell head">Qua</div>
                    <div class="cal-cell head">Qui</div>
                    <div class="cal-cell head">Sex</div>
                    <div class="cal-cell head">Sáb</div>
                    <div class="cal-cell head">Dom</div>
                </div>
            </div>
        </div>
    </div>

    <div id="full-calendar-modal" style="display:none; position:fixed; inset:0; background:rgba(255,255,255,0.98); z-index:1000; overflow-y:auto; padding:40px;">
        <button onclick="closeFullCalendar()" style="position:absolute; top:20px; right:30px; font-size: 40px; border:none; background:none; cursor:pointer; color: var(--navy);">&times;</button>
        <h2 style="text-align: center; color: var(--navy); margin-bottom: 30px;">CALENDÁRIO ANUAL</h2>
        <div id="full-calendar-content"></div>
    </div>

    <script src="script.js"></script>
    <script>
        async function verificarInicializacao() {
            if (typeof clienteSupabase === 'undefined') return;

            const { data: { session } } = await clienteSupabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            
            const parteEmail = session.user.email.split('@')[0];
            const nomeFormatado = parteEmail.split(/[._-]/).map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(' ');
            document.getElementById('welcome-message').innerText = "Bem-vindo, " + nomeFormatado;
            
            renderCalendar();
            inicializarPainel(); // Chamada direta sem setTimeout
        }
        window.addEventListener('load', verificarInicializacao);
    </script>
</body>
</html>
