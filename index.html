<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ColetaWeb</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div style="text-align:center; margin-top:50px;">
        <h2>LOGIN</h2>
        <input type="email" id="email" placeholder="E-mail"><br>
        <input type="password" id="password" placeholder="Senha"><br>
        <button id="loginBtn">ENTRAR</button>
    </div>

    <script>
        const supabase = supabase.createClient(
            'https://ekmcgifpvqrdgcikvepe.supabase.co', 
            'sb_publishable_DzhY4TT7JpShnqphkGa1Rg_Acjy2B0s'
        );

        document.getElementById('loginBtn').onclick = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) alert(error.message);
            else alert("Sucesso! Logado.");
        };
    </script>
</body>
</html>
