<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Script do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
    <title>Home | ColetaWeb</title>
</head>
<body>
    <!-- Cabeçalho com Logo e Texto Centralizado -->
    <div class="card" style="margin-bottom: 20px; display: flex; align-items: center; padding: 15px 25px;">
        <div style="flex: 0 0 150px; font-size: 20px; font-weight: 800; cursor: default;">
            <span style="color: var(--navy);">minerva</span><span style="color: var(--red);">foods</span>
        </div>
        <div style="flex: 1; text-align: center;">
            <h1 style="color: var(--navy); font-size: 1.5rem;">Bem-vindo, Leandro</h1>
            <p>Sistema ColetaWeb - Logística Internacional</p>
        </div>
        <div style="flex: 0 0 150px;"></div>
    </div>

    <!-- Container com Layout Lateral -->
    <div class="card" style="display: flex; gap: 40px; align-items: flex-start;">
        <div style="flex: 0 0 250px; display: flex; flex-direction: column; gap: 15px;">
            <button class="btn-main" onclick="window.location.href='coleta.html'" style="width: 100%;">+ REGISTRO DE COLETA</button>
            <div id="admin-container" style="display:none;">
                <button class="btn-main" style="width: 100%; background: var(--red);" onclick="window.location.href='admin.html'">PAINEL MASTER</button>
            </div>
        </div>

        <div style="flex: 1; display: flex; justify-content: flex-end;">
            <div style="width: 100%; max-width: 600px;">
                <div id="calendar-header" style="text-align: center; font-weight: 800; color: var(--navy); margin-bottom: 15px;"></div>
                <div id="calendar-grid" class="calendar-grid" style="margin-top: 0; width: 100%;">
                    <div class="cal-cell head">Nº</div>
                    <div class="cal-cell head">Seg</div>
                    <div class="cal-cell head">Ter</div>
                    <div class="cal-cell head">Qua</div>
                    <div class="cal-cell head">Qui</div>
                    <div class="cal-cell head">Sex</div>
                    <div class="cal-cell head">Sáb</div>
                    <div class="cal-cell head">Dom</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Anual -->
    <div id="full-calendar-modal" style="display:none; position:fixed; inset:0; background:rgba(255,255,255,0.98); z-index:1000; overflow-y:auto; padding:40px;">
        <button onclick="closeFullCalendar()" style="position:absolute; top:20px; right:30px; font-size: 40px; border:none; background:none; cursor:pointer; color: var(--navy);">&times;</button>
        <h2 style="text-align: center; color: var(--navy); margin-bottom: 30px;">CALENDÁRIO ANUAL</h2>
        <div id="full-calendar-content"></div>
    </div>

    <script src="script.js"></script>
    <script>
        async function verificarInicializacao() {
            // Usamos a variável 'clienteSupabase' que definimos no seu script.js
            const { data: { session } } = await clienteSupabase.auth.getSession();
            
            if (!session) {
                window.location.href = 'login.html';
                return;
            }
            
            // Renderiza o conteúdo após validar a sessão
            renderCalendar();
            inicializarPainel();
        }

        // Aguarda o carregamento total para evitar conflitos
        window.addEventListener('load', verificarInicializacao);
    </script>
</body>
</html>
