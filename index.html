<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ColetaWeb</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div style="text-align:center; margin-top:50px;">
        <h2>LOGIN</h2>
        <input type="email" id="email" placeholder="E-mail"><br>
        <input type="password" id="password" placeholder="Senha"><br>
        <button id="loginBtn">ENTRAR</button>
    </div>

    <script>
        console.log("Script carregado!");
        
        const sbClient = supabase.createClient(
            'https://ekmcgifpvqrdgcikvepe.supabase.co', 
            'sb_publishable_DzhY4TT7JpShnqphkGa1Rg_Acjy2B0s'
        );

        document.getElementById('loginBtn').addEventListener('click', async () => {
            console.log("Botão clicado!");
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            console.log("Tentando auth com:", email);

            try {
                const { data, error } = await sbClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    console.error("Erro retornado:", error);
                    alert("Erro do Supabase: " + error.message);
                } else {
                    console.log("Sucesso:", data);
                    alert("Sucesso! Logado.");
                }
            } catch (err) {
                console.error("Erro crítico:", err);
                alert("Erro no código: " + err);
            }
        });
    </script>
</body>
</html>
