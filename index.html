<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ColetaWeb</title>
    <!-- Carregando a biblioteca Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div style="text-align:center; margin-top:50px;">
        <h2>LOGIN</h2>
        <input type="email" id="email" placeholder="E-mail"><br>
        <input type="password" id="password" placeholder="Senha"><br>
        <button id="loginBtn">ENTRAR</button>
    </div>

    <script>
        // Usamos uma variável única que não conflita com a biblioteca
        const sbClient = supabase.createClient(
            'https://ekmcgifpvqrdgcikvepe.supabase.co', 
            'sb_publishable_DzhY4TT7JpShnqphkGa1Rg_Acjy2B0s'
        );

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const { data, error } = await sbClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    alert("Erro: " + error.message);
                } else {
                    alert("Sucesso! Logado.");
                    console.log("Usuário:", data.user);
                }
            } catch (err) {
                console.error("Erro inesperado:", err);
            }
        });
    </script>
</body>
</html>
