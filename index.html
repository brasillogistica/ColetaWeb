  <script>
    // Calendário montado em memória e inserido em uma só operação.
    function renderCalendarRapido() {
      const now = new Date();
      const ano = now.getFullYear(), mes = now.getMonth();
      const header = document.getElementById('calendar-header');
      const grid = document.getElementById('calendar-grid');
      if (!grid) return;
      if (header) {
        const nomeMes = now.toLocaleString(window.ColetaIdioma?.current || 'pt-BR', { month: 'long', year: 'numeric' }).toUpperCase();
        header.innerHTML = `<span style="display:inline-block;vertical-align:middle">${nomeMes}</span><button onclick="expandCalendar()" style="margin-left:10px;cursor:pointer;background:var(--navy);color:white;border:none;border-radius:50%;width:25px;height:25px;font-weight:800;font-size:16px">+</button>`;
      }
      const primeiroDia = new Date(ano, mes, 1).getDay();
      const quantidadeDias = new Date(ano, mes + 1, 0).getDate();
      let semana = getWeekNumber(new Date(ano, mes, 1));
      const html = [`<div class="cal-cell week-number">${semana}</div>`];
      for (let i = 0; i < (primeiroDia === 0 ? 6 : primeiroDia - 1); i++) html.push('<div class="cal-cell"></div>');
      for (let dia = 1; dia <= quantidadeDias; dia++) {
        const diaSemana = new Date(ano, mes, dia).getDay();
        const classes = ['cal-cell','day-number'];
        if (dia === now.getDate()) classes.push('today');
        if (diaSemana === 0 || diaSemana === 6) classes.push('weekend');
        html.push(`<div class="${classes.join(' ')}">${dia}</div>`);
        if (diaSemana === 0 && dia < quantidadeDias) html.push(`<div class="cal-cell week-number">${++semana}</div>`);
      }
      grid.querySelectorAll('.day-number,.week-number,.cal-cell:not(.head)').forEach(el => el.remove());
      grid.insertAdjacentHTML('beforeend', html.join(''));
    }

    // Inicialização em uma única etapa: sem consultas repetidas de permissão.
    async function verificarInicializacao() {
      const menu = document.querySelector('.side-menu');
      const admin = document.getElementById('admin-container');
      const analise = document.getElementById('analise-processos-container');
      const booking = document.getElementById('booking-container');
      try {
        if (!clienteSupabase) throw new Error('Supabase não carregado.');
        const { data, error } = await clienteSupabase.auth.getSession();
        if (error) throw error;
        const session = data?.session;
        if (!session) {
          location.replace('login.html');
          return;
        }

        const email = session.user.email || '';
        const parteEmail = email.split('@')[0];
        const nomeFormatado = parteEmail.split(/[._-]/)
          .map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(' ');
        await window.ColetaIdioma.init(email, nomeFormatado);
        // Mostrar somente os menus comuns após confirmar uma sessão válida.
        // Os menus privilegiados permanecem ocultos até a consulta de perfil terminar.
        if (menu) menu.classList.add('menus-prontos');
        renderCalendarRapido();

        // Uma única consulta para exibir o menu inteiro simultaneamente.
        // Em caso de erro, mantém os itens restritos ocultos.
        const { data: usuario, error: erroPerfil } = await clienteSupabase
          .from('usuarios')
          .select('perfil, status')
          .eq('email', email)
          .maybeSingle();
        if (erroPerfil) console.error('Não foi possível consultar o perfil:', erroPerfil);
        const perfil = String(usuario?.perfil || '').trim().toLowerCase();
        const status = String(usuario?.status || '').trim().toLowerCase();
        const autorizado = !erroPerfil && (
          perfil === 'master' || perfil === 'mestre' ||
          (perfil === 'administrador' && (status === '' || status === 'aprovado'))
        );

        // Aplica todas as permissões antes de exibir qualquer botão.
        admin.style.display = autorizado ? 'flex' : 'none';
        analise.style.display = autorizado ? 'block' : 'none';
        booking.style.display = autorizado ? 'block' : 'none';
      } catch (error) {
        console.error('Falha ao iniciar menu:', error);
        if (admin) admin.style.display = 'none';
        if (analise) analise.style.display = 'none';
        if (booking) booking.style.display = 'none';
        const welcome = document.getElementById('welcome-message');
        if (welcome) welcome.textContent = 'ColetaWeb';
        if (typeof renderCalendarRapido === 'function') renderCalendarRapido();
      } finally {
        if (menu) menu.classList.add('menus-prontos');
      }
    }
    // Não espera imagens e recursos externos terminarem para começar.
    document.addEventListener('DOMContentLoaded', verificarInicializacao, { once: true });
  </script>
