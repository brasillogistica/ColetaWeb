<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css">
  <title>Home | ColetaWeb</title>
</head>
<body>
  <div class="page-shell">
    <div class="card header-card">
      <div class="header-left">
        <span class="m">minerva</span><span class="f">foods</span>
      </div>

      <div class="header-center">
        <h1 id="welcome-message">Carregando...</h1>
        <div class="header-subtitle">Sistema ColetaWeb - Logística Internacional</div>
      </div>

      <div class="header-right">
        <button class="btn-main btn-sair" onclick="fazerLogout()">SAIR</button>
      </div>
    </div>

    <div class="card workspace-card">
      <div class="workspace-main">
        <div class="menu-column">
          <div class="side-menu">
            <button class="container-btn container-blue" onclick="window.location.href='coleta.html'">
              <span>REGISTRAR COLETA</span>
              <div class="top-bar"></div>
              <div class="bottom-bar"></div>
              <div class="corner tl"></div>
              <div class="corner tr"></div>
              <div class="corner bl"></div>
              <div class="corner br"></div>
            </button>

            <button class="container-btn container-sand" onclick="window.location.href='processos.html'">
              <span>PROCESSOS - CONTAINER</span>
              <div class="top-bar"></div>
              <div class="bottom-bar"></div>
              <div class="corner tl"></div>
              <div class="corner tr"></div>
              <div class="corner bl"></div>
              <div class="corner br"></div>
            </button>

            <div id="analise-processos-container" style="display:none;">
              <button class="container-btn container-dark" onclick="window.location.href='analise-processos.html'">
                <span>ANÁLISE PROCESSOS</span>
                <div class="top-bar"></div>
                <div class="bottom-bar"></div>
                <div class="corner tl"></div>
                <div class="corner tr"></div>
                <div class="corner bl"></div>
                <div class="corner br"></div>
              </button>
            </div>

            <div id="admin-container" style="display:none; flex-direction: column; gap: 12px;">
              <button class="container-btn container-blue" onclick="window.location.href='gestao.html'">
                <span>PAINEL DE GESTÃO</span>
                <div class="top-bar"></div>
                <div class="bottom-bar"></div>
                <div class="corner tl"></div>
                <div class="corner tr"></div>
                <div class="corner bl"></div>
                <div class="corner br"></div>
              </button>

              <button class="container-btn container-red" onclick="window.location.href='admin.html'">
                <span>GERENCIAMENTO</span>
                <div class="top-bar"></div>
                <div class="bottom-bar"></div>
                <div class="corner tl"></div>
                <div class="corner tr"></div>
                <div class="corner bl"></div>
                <div class="corner br"></div>
              </button>

              <button class="container-btn container-dark" onclick="window.location.href='cadastro-transportadora.html'">
                <span>CADASTRAR TRANSPORTADORA</span>
                <div class="top-bar"></div>
                <div class="bottom-bar"></div>
                <div class="corner tl"></div>
                <div class="corner tr"></div>
                <div class="corner bl"></div>
                <div class="corner br"></div>
              </button>
            </div>
          </div>
        </div>

        <div class="calendar-area">
          <div class="calendar-box">
            <div id="calendar-header"></div>
            <div id="calendar-grid" class="calendar-grid">
              <div class="cal-cell head">Nº</div>
              <div class="cal-cell head">Seg</div>
              <div class="cal-cell head">Ter</div>
              <div class="cal-cell head">Qua</div>
              <div class="cal-cell head">Qui</div>
              <div class="cal-cell head">Sex</div>
              <div class="cal-cell head">Sáb</div>
              <div class="cal-cell head">Dom</div>
            </div>
          </div>
        </div>
      </div>

      <div class="footer">Desenvolvido por Leandro Brasil • 2026</div>
    </div>
  </div>

  <div id="full-calendar-modal">
    <button onclick="closeFullCalendar()" class="close-full-calendar">&times;</button>
    <h2>CALENDÁRIO ANUAL</h2>
    <div id="full-calendar-content"></div>
  </div>

  <div id="loading-overlay">
    <div class="spinner"></div>
  </div>

  <script src="script.js"></script>
  <script>
    function normalizarValorMenu(valor) {
      return String(valor || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .trim()
        .toLowerCase();
    }

    async function configurarMenuAnaliseProcessos() {
      const container = document.getElementById('analise-processos-container');
      if (!container) return;

      try {
        // Usa a mesma regra de permissão já existente no ColetaWeb.
        // A função checarPermissaoMaster também aceita Administrador aprovado.
        const permitido = (typeof checarPermissaoMaster === 'function')
          ? await checarPermissaoMaster()
          : false;

        // Master/Administrador: mostra. User: esconde.
        container.style.display = permitido ? 'block' : 'none';
      } catch (error) {
        console.error('Erro ao configurar menu Análise Processos:', error);
        container.style.display = 'none';
      }
    }

    async function verificarInicializacao() {
      if (typeof clienteSupabase === 'undefined' || !clienteSupabase) {
        setTimeout(verificarInicializacao, 300);
        return;
      }

      try {
        const { data: { session } } = await clienteSupabase.auth.getSession();

        if (!session) {
          window.location.href = 'login.html';
          return;
        }

        const parteEmail = session.user.email.split('@')[0];
        const nomeFormatado = parteEmail
          .split(/[._-]/)
          .map(p => p.charAt(0).toUpperCase() + p.slice(1))
          .join(' ');

        document.getElementById('welcome-message').innerText = 'Bem-vindo, ' + nomeFormatado;

        renderCalendar();
        await inicializarPainel();
        await configurarMenuAnaliseProcessos();
      } catch (error) {
        console.error('Erro ao inicializar:', error);
      }
    }

    window.addEventListener('load', verificarInicializacao);
  </script>
</body>
</html>
